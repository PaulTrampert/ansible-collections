---
- name: Check the remote and the users
  ansible.builtin.assert:
    that:
      - rclone_restic_server_remote | length > 0
      - rclone_restic_server_users | length > 0
      - rclone_restic_server_users | map(attribute='name') | select('search', '[:/]') | list | length == 0
      - rclone_restic_server_users | map(attribute='name') | unique | length == rclone_restic_server_users | length
    fail_msg: >-
      rclone_restic_server_remote must name what to serve, and
      rclone_restic_server_users must list at least one user, each with a
      distinct name containing no ':' or '/'. Without users the server would
      let anyone in.

# kubernetes.core.k8s runs on this host and needs the Python client. The
# distribution's package is older than kubernetes.core supports, so the client
# comes from PyPI, into a venv of its own.
- name: Install venv support
  ansible.builtin.apt:
    name: python3-venv
    state: present

- name: Install the Python Kubernetes client
  ansible.builtin.pip:
    name: kubernetes=={{ rclone_restic_server_kubernetes_client_version }}
    virtualenv: "{{ rclone_restic_server_venv }}"
    virtualenv_command: python3 -m venv

- name: Deploy the server
  vars:
    ansible_python_interpreter: "{{ rclone_restic_server_venv }}/bin/python"
  block:
    - name: Create the namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ rclone_restic_server_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ rclone_restic_server_namespace }}"

    - name: Store the seed config and the users
      kubernetes.core.k8s:
        kubeconfig: "{{ rclone_restic_server_kubeconfig }}"
        template: secrets.yaml.j2
      no_log: true

    - name: Claim the volume for the server's copy of the config
      kubernetes.core.k8s:
        kubeconfig: "{{ rclone_restic_server_kubeconfig }}"
        template: config-volume.yaml.j2

    - name: Run the server
      kubernetes.core.k8s:
        kubeconfig: "{{ rclone_restic_server_kubeconfig }}"
        template: deployment.yaml.j2
        wait: true
        wait_timeout: 300

    - name: Expose the server inside the cluster
      kubernetes.core.k8s:
        kubeconfig: "{{ rclone_restic_server_kubeconfig }}"
        template: service.yaml.j2
