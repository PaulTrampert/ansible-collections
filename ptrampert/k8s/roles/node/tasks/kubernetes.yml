---
- name: Gather installed package facts
  ansible.builtin.package_facts:

# Only on a host that lacks them. On a node already in the cluster, moving the
# packages to a new version is an upgrade, which ptrampert.k8s.control_plane and
# ptrampert.k8s.worker carry out one node at a time, in the order kubeadm needs.
- name: Install Kubernetes packages
  ansible.builtin.apt:
    name: >-
      {{ node_kubernetes_packages | reject('in', ansible_facts['packages'])
         | map('regex_replace', '$', '=' ~ node_kubernetes_version ~ '-*') }}
    state: present
  when: node_kubernetes_packages | reject('in', ansible_facts['packages']) | length > 0

- name: Hold Kubernetes packages at their installed version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ node_kubernetes_packages }}"

# What the upgrade in ptrampert.k8s.control_plane and ptrampert.k8s.worker
# moves the node to, read back as ansible_local.ptrampert_k8s_node.
- name: Create the local facts directory
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Record the node's target versions
  ansible.builtin.copy:
    dest: /etc/ansible/facts.d/ptrampert_k8s_node.fact
    content: "{{ node_local_facts | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Set the kubelet node IP
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: "KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Restart kubelet

# The kubelet restarts in a loop until kubeadm init or join configures it.
- name: Enable kubelet
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
