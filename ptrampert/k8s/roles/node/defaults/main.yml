---
# Kubernetes version for kubelet, kubeadm, and kubectl. The packages are held.
# On a node that already has them, this role leaves them alone, and changing
# the version upgrades the cluster: ptrampert.k8s.control_plane and
# ptrampert.k8s.worker carry out the kubeadm upgrade procedure, one minor
# version at a time. It has no Renovate annotation yet. When it moves to a new
# minor version, move the cap on the Python Kubernetes client in
# .github/renovate.json5 with it.
node_kubernetes_version: "1.36.4"

# containerd.io release series from Docker's apt repository. apt is pinned to
# this series, so routine OS upgrades pick up patch releases only. On a node
# that already has containerd, changing it moves the node to the new series
# during the upgrade in ptrampert.k8s.control_plane and ptrampert.k8s.worker,
# while the node is cordoned. It has no Renovate annotation yet either.
node_containerd_series: "2.3"

# Pod sandbox ("pause") image. Keep it in step with the one kubeadm expects for
# node_kubernetes_version (see `kubeadm config images list`).
node_sandbox_image: "registry.k8s.io/pause:3.10.2"

# Address the kubelet registers for this node. Set it explicitly on hosts with
# more than one interface, e.g. Vagrant VMs, whose NAT interface has the same
# address on every VM.
node_ip: "{{ ansible_facts['default_ipv4']['address'] }}"
