---
# Inventory group holding the control-plane nodes. The first host in it
# bootstraps the cluster with kubeadm init; the rest join it.
control_plane_group: control_plane

# Address the API server advertises to the rest of the cluster.
control_plane_advertise_address: "{{ ansible_facts['default_ipv4']['address'] }}"

# control_plane_endpoint has no default and must be set: the address
# (host[:port]) clients reach the API server at. See meta/argument_specs.yml.

control_plane_pod_network_cidr: "10.244.0.0/16"
control_plane_service_cidr: "10.96.0.0/12"

# Allow ordinary workloads on control-plane nodes (e.g. a single-node cluster).
control_plane_schedulable: false

# How long the kubelet delays node shutdown so pods can stop cleanly. Critical
# pods get the last control_plane_shutdown_grace_period_critical_pods of it.
control_plane_shutdown_grace_period: "60s"
control_plane_shutdown_grace_period_critical_pods: "20s"

# Users who get a copy of the cluster-admin kubeconfig as ~/.kube/config.
control_plane_kubeconfig_users: []

# renovate: datasource=github-releases depName=helm/helm
control_plane_helm_version: "v4.3.0"

# Flannel release (Helm chart version) used as the cluster's CNI.
# renovate: datasource=helm depName=flannel registryUrl=https://flannel-io.github.io/flannel/
control_plane_flannel_version: "v0.28.9"

# Interface Flannel uses for traffic between nodes. Empty means the interface
# with the default route.
control_plane_flannel_iface: ""

# Drain each control-plane node before upgrading its kubelet. Off, a node is
# only cordoned: restarting the kubelet leaves its running containers alone,
# and draining a node whose pods have nowhere else to go, such as the only node,
# stops every workload until it is uncordoned.
control_plane_drain_on_upgrade: false
