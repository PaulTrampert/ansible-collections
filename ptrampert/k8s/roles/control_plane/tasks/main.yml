---
- name: Check the control-plane configuration
  ansible.builtin.import_tasks: validate.yml

# Before init.yml, whose kubeadm configuration records the installed kubeadm
# version, which the upgrade moves.
- name: Upgrade the cluster to the target version
  ansible.builtin.import_tasks: upgrade.yml

- name: Initialize the cluster
  ansible.builtin.import_tasks: init.yml
  when: control_plane_is_first | bool

# Runs on the whole group: the first node needs the same look at who has
# joined, and the credentials are issued once for all the nodes that have not.
- name: Join the remaining control-plane nodes
  ansible.builtin.import_tasks: join.yml

- name: Install kubeconfigs for kubectl users
  ansible.builtin.import_tasks: kubeconfig.yml

- name: Install Helm
  ansible.builtin.import_tasks: helm.yml

- name: Configure the cluster through the API server
  environment:
    KUBECONFIG: "{{ control_plane_admin_kubeconfig }}"
  block:
    # Cluster-wide, so only the node that created the cluster installs it.
    # Nodes joining later pick up the DaemonSet on their own.
    - name: Install the CNI plugin
      ansible.builtin.import_tasks: cni.yml
      when: control_plane_is_first | bool

    - name: Wait for the node to become Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready node/{{ control_plane_node_name }} --timeout=300s
      changed_when: false

    - name: Configure control-plane scheduling
      ansible.builtin.import_tasks: scheduling.yml
