---
- name: Check that every control-plane node is in this play
  vars:
    control_plane_missing: >-
      {{ groups[control_plane_group]
         | reject('in', ansible_play_hosts_all) | list }}
  ansible.builtin.assert:
    that:
      - control_plane_missing | length == 0
    fail_msg: >-
      The control-plane nodes have to be configured together, because the first
      one creates the cluster and issues the join credentials for the rest at
      once: {{ control_plane_missing | join(', ') }}
      {{ 'is' if control_plane_missing | length == 1 else 'are' }} in
      {{ control_plane_group }} but not in this play. Run against the whole
      group rather than limiting to one host.
    quiet: true

- name: Check that the API server has an endpoint
  ansible.builtin.assert:
    that:
      - control_plane_endpoint | length > 0
    fail_msg: >-
      control_plane_endpoint must give the address (host[:port]) clients reach
      the API server at. kubeadm fixes it when the cluster is created and it
      cannot be changed afterwards, so set one even for a single control-plane
      node: a DNS name, or a virtual address floated across the control-plane
      nodes, can later serve more of them. See the collection README.
    quiet: true
