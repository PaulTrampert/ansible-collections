---
# Moves the control plane to the Kubernetes version and containerd series that
# ptrampert.k8s.node recorded on each host. Does nothing on a cluster that is
# already there, or that does not exist yet.
- name: Read the targets ptrampert.k8s.node recorded
  ansible.builtin.setup:
    filter: ansible_local

- name: Check that ptrampert.k8s.node has run
  ansible.builtin.assert:
    that:
      - ansible_local['ptrampert_k8s_node'] is defined
    fail_msg: >-
      {{ inventory_hostname }} has no target versions in
      /etc/ansible/facts.d/ptrampert_k8s_node.fact. Run ptrampert.k8s.node on
      it before this role.
    quiet: true

- name: Gather installed package facts
  ansible.builtin.package_facts:

- name: Check that the control-plane nodes agree on the target version
  ansible.builtin.assert:
    that:
      - control_plane_upgrade_targets | unique | length == 1
    fail_msg: >-
      The control-plane nodes were given different Kubernetes versions
      ({{ control_plane_upgrade_targets | unique | join(', ') }}).
      node_kubernetes_version has to be the same on all of them.
    quiet: true
  run_once: true

- name: Check whether the cluster exists
  ansible.builtin.stat:
    path: "{{ control_plane_admin_kubeconfig }}"
  register: control_plane_admin_conf
  when: control_plane_is_first | bool

# From the first control-plane node only, which runs kubeadm upgrade apply and
# reaches every other node by delegation, so the nodes go one at a time.
- name: Upgrade the cluster
  when:
    - control_plane_is_first | bool
    - control_plane_admin_conf.stat.exists
  environment:
    KUBECONFIG: "{{ control_plane_admin_kubeconfig }}"
  block:
    - name: Read the cluster's configuration
      ansible.builtin.command: >-
        kubectl get configmap kubeadm-config --namespace kube-system
        --output jsonpath={.data.ClusterConfiguration}
      register: control_plane_cluster_configuration
      changed_when: false

    - name: Read the nodes' kubelet versions
      ansible.builtin.command: kubectl get nodes --output json
      register: control_plane_cluster_nodes
      changed_when: false

    # Before anything changes, so a version kubeadm cannot reach fails here
    # rather than part way through the cluster.
    - name: Check that the cluster can be upgraded to the target version
      ansible.builtin.assert:
        that:
          - control_plane_upgrade_ahead | length == 0
          - control_plane_upgrade_too_far | length == 0
          - control_plane_upgrade_unexplained | length == 0
        fail_msg: >-
          Cannot move the cluster (at {{ control_plane_cluster_version }}) to
          {{ control_plane_upgrade_version }}.
          {% if control_plane_upgrade_ahead %}
          Downgrades are not supported, and {{ control_plane_upgrade_ahead | join(', ') }}
          {{ 'is' if control_plane_upgrade_ahead | length == 1 else 'are' }} already newer.
          {% endif %}
          {% if control_plane_upgrade_too_far %}
          kubeadm upgrades one minor version at a time, and
          {{ control_plane_upgrade_too_far | join(', ') }}
          {{ 'is' if control_plane_upgrade_too_far | length == 1 else 'are' }} further behind
          than {{ control_plane_upgrade_previous_minor }}. Upgrade to each minor version
          in between first.
          {% endif %}
          {% if control_plane_upgrade_unexplained %}
          The kubelet on {{ control_plane_upgrade_unexplained | join(', ') }} is newer
          than the control plane, which an interrupted upgrade does not leave behind.
          {% endif %}
        quiet: true

    - name: Upgrade the control-plane nodes one at a time
      ansible.builtin.include_tasks: upgrade_node.yml
      loop: "{{ [control_plane_first] + control_plane_others }}"
      loop_control:
        loop_var: control_plane_upgrade_host
