---
control_plane_admin_kubeconfig: /etc/kubernetes/admin.conf
control_plane_kubeadm_config: /etc/kubernetes/kubeadm-init.yaml
control_plane_node_name: "{{ ansible_facts['nodename'] | lower }}"

# The host that runs kubeadm init; every other host in the group joins it.
control_plane_first: "{{ groups[control_plane_group][0] }}"
control_plane_is_first: "{{ inventory_hostname == control_plane_first }}"

# The control-plane nodes other than the one that creates the cluster, and
# those among them that have yet to join it.
# reject rather than difference: difference is set-based, so its order varies
# from run to run, which would shuffle the order nodes join in.
control_plane_others: >-
  {{ groups[control_plane_group] | reject('eq', control_plane_first)
     | select('in', ansible_play_hosts) | list }}

control_plane_joiners: >-
  {{ dict(control_plane_others | zip(control_plane_others
          | map('extract', hostvars, ['control_plane_kubelet_conf', 'stat', 'exists'])))
     | dict2items | rejectattr('value') | map(attribute='key') | list }}

# Host and port of control_plane_endpoint, which kubeadm gives port 6443 when
# it has none.
control_plane_endpoint_host: "{{ control_plane_endpoint | regex_replace(':[0-9]+$', '') }}"
control_plane_endpoint_port: >-
  {{ control_plane_endpoint.split(':') | last
     if control_plane_endpoint is search(':[0-9]+$') else '6443' }}

control_plane_helm_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
control_plane_helm_dir: /usr/local/lib/helm-{{ control_plane_helm_version }}
control_plane_helm_archive: helm-{{ control_plane_helm_version }}-linux-{{ control_plane_helm_arch }}.tar.gz

control_plane_flannel_args: >-
  {{ ['--ip-masq', '--kube-subnet-mgr']
     + (['--iface=' ~ control_plane_flannel_iface] if control_plane_flannel_iface else []) }}

# The upgrade. Targets are what ptrampert.k8s.node recorded on each host.
control_plane_upgrade_targets: >-
  {{ groups[control_plane_group] | select('in', ansible_play_hosts)
     | map('extract', hostvars, ['ansible_local', 'ptrampert_k8s_node', 'kubernetes_version'])
     | list }}
control_plane_upgrade_version: "{{ ansible_local['ptrampert_k8s_node']['kubernetes_version'] }}"
control_plane_upgrade_previous_minor: >-
  {{ control_plane_upgrade_version.split('.')[0] }}.{{ control_plane_upgrade_version.split('.')[1] | int - 1 }}

control_plane_cluster_version: >-
  {{ (control_plane_cluster_configuration.stdout | from_yaml)['kubernetesVersion'] | regex_replace('^v', '') }}

# Node name to kubelet version, and the same with the control plane's own
# version under "the control plane".
control_plane_cluster_kubelets: >-
  {{ dict((control_plane_cluster_nodes.stdout | from_json)['items'] | map(attribute='metadata.name')
          | zip((control_plane_cluster_nodes.stdout | from_json)['items']
                | map(attribute='status.nodeInfo.kubeletVersion') | map('regex_replace', '^v', ''))) }}
control_plane_cluster_versions: >-
  {{ control_plane_cluster_kubelets | combine({'the control plane': control_plane_cluster_version}) }}

# What the skew check refuses: anything newer than the target, anything more
# than one minor version behind it, and a kubelet newer than the control plane.
control_plane_upgrade_ahead: >-
  {{ control_plane_cluster_versions | dict2items
     | selectattr('value', 'version', control_plane_upgrade_version, '>')
     | map(attribute='key') | list }}
control_plane_upgrade_too_far: >-
  {{ control_plane_cluster_versions | dict2items
     | selectattr('value', 'version', control_plane_upgrade_previous_minor ~ '.0', '<')
     | map(attribute='key') | list }}
control_plane_upgrade_unexplained: >-
  {{ control_plane_cluster_kubelets | dict2items
     | selectattr('value', 'version', control_plane_cluster_version, '>')
     | map(attribute='key') | list }}

# The node upgrade_node.yml is upgrading, and which of its packages are already
# at the target: the Kubernetes packages at its version, containerd in its
# series.
control_plane_upgrade_node: "{{ hostvars[control_plane_upgrade_host]['ansible_facts']['nodename'] | lower }}"
control_plane_upgrade_installed: "{{ hostvars[control_plane_upgrade_host]['ansible_facts']['packages'] }}"
control_plane_upgrade_series: >-
  {{ hostvars[control_plane_upgrade_host]['ansible_local']['ptrampert_k8s_node']['containerd_series'] }}
control_plane_upgrade_packages:
  kubeadm: "{{ control_plane_upgrade_installed['kubeadm'][0]['version'].startswith(control_plane_upgrade_version ~ '-') }}"
  kubelet: "{{ control_plane_upgrade_installed['kubelet'][0]['version'].startswith(control_plane_upgrade_version ~ '-') }}"
  kubectl: "{{ control_plane_upgrade_installed['kubectl'][0]['version'].startswith(control_plane_upgrade_version ~ '-') }}"
  containerd.io: "{{ control_plane_upgrade_installed['containerd.io'][0]['version'].startswith(control_plane_upgrade_series ~ '.') }}"

# Marks a node this role cordoned for its upgrade.
control_plane_upgrade_annotation: ptrampert.k8s/upgrading
control_plane_upgrade_drain_timeout: 5m
