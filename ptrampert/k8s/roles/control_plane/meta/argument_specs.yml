---
argument_specs:
  main:
    short_description: Bootstrap and grow the Kubernetes control plane.
    description:
      - Runs kubeadm init on the first host in the control-plane group and
        kubeadm join on the rest, installs Helm, installs Flannel as the CNI
        plugin, and sets whether ordinary workloads may run on each node.
      - Gives the cluster the stable API server address in
        control_plane_endpoint. kubeadm fixes that address at init and it
        cannot be changed afterwards, so a cluster is configured with one
        whether or not it has a second control-plane node yet. The role does
        not serve the address itself; whatever does, such as HAProxy and
        keepalived on the control-plane nodes or a load balancer in front of
        them, has to be in place before the role runs.
      - Adding a control-plane node is a matter of putting it in the
        control-plane group and running the role again. Run the role against
        the whole group, not one host at a time, because each node needs the
        addresses of the others.
      - Upgrades an existing cluster to the Kubernetes version and containerd
        series ptrampert.k8s.node recorded on the hosts, one minor version at
        a time. On the first control-plane node it runs kubeadm upgrade apply,
        then upgrades the control-plane nodes one at a time. Each is cordoned
        (kubeadm upgrade node first on all but the first), gets containerd,
        kubelet and kubectl, has its kubelet restarted, and is uncordoned. Before changing anything it fails on a downgrade or
        a jump of more than one minor version. A run that stopped part way
        resumes where it left off.
      - Requires ptrampert.k8s.node to have run on the host first.
    options:
      control_plane_group:
        type: str
        default: control_plane
        description:
          - Inventory group holding the control-plane nodes. The first host in
            it creates the cluster; the rest join it.
      control_plane_advertise_address:
        type: str
        default: "{{ ansible_facts['default_ipv4']['address'] }}"
        description:
          - Address this node's API server and etcd member advertise to the
            rest of the cluster.
      control_plane_endpoint:
        type: str
        required: true
        description:
          - Address (host[:port]) clients reach the API server at, which kubeadm
            writes into every kubeconfig and certificate at init. Without a
            port, kubeadm uses 6443.
          - It must forward to port 6443 on every control-plane node, and be
            reachable before the role runs.
          - A DNS name keeps the most options open, since it can be pointed at
            a different address later. The address itself cannot change.
      control_plane_pod_network_cidr:
        type: str
        default: "10.244.0.0/16"
        description:
          - Pod network range, shared by kubeadm and Flannel.
      control_plane_service_cidr:
        type: str
        default: "10.96.0.0/12"
        description:
          - Service virtual IP range.
      control_plane_schedulable:
        type: bool
        default: false
        description:
          - Allow ordinary workloads on the control-plane nodes.
      control_plane_shutdown_grace_period:
        type: str
        default: "60s"
        description:
          - Total time the kubelet delays node shutdown so pods can stop cleanly.
      control_plane_shutdown_grace_period_critical_pods:
        type: str
        default: "20s"
        description:
          - Part of the shutdown grace period reserved for critical pods.
      control_plane_kubeconfig_users:
        type: list
        elements: str
        default: []
        description:
          - Users who get the cluster-admin kubeconfig as ~/.kube/config.
      control_plane_drain_on_upgrade:
        type: bool
        default: false
        description:
          - Drain each control-plane node before upgrading its kubelet. Off,
            the node is only cordoned while it is upgraded; restarting the
            kubelet leaves running containers alone.
          - A drain that does not finish within five minutes, for example
            because a PodDisruptionBudget will not let a pod go, fails the
            run and leaves the node cordoned. Running the role again resumes
            from it.
      control_plane_helm_version:
        type: str
        # renovate: datasource=github-releases depName=helm/helm
        default: "v4.3.0"
        description:
          - Helm release to install.
      control_plane_flannel_version:
        type: str
        # renovate: datasource=helm depName=flannel registryUrl=https://flannel-io.github.io/flannel/
        default: "v0.28.9"
        description:
          - Flannel Helm chart version.
      control_plane_flannel_iface:
        type: str
        default: ""
        description:
          - Interface Flannel uses between nodes. Empty uses the interface with
            the default route.
