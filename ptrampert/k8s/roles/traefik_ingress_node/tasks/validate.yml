---
- name: Check that this host is in the ingress group
  ansible.builtin.assert:
    that:
      - inventory_hostname in traefik_ingress_node_hosts
    fail_msg: >-
      The ingress nodes are the hosts in {{ traefik_ingress_node_group }}, and
      {{ inventory_hostname }} is not one of them. Add it to the group, or set
      traefik_ingress_node_group to the group this role is applied to.
    quiet: true

- name: Check that every ingress node is in this play
  vars:
    traefik_ingress_node_missing: >-
      {{ traefik_ingress_node_hosts | reject('in', ansible_play_hosts_all) | list }}
  ansible.builtin.assert:
    that:
      - traefik_ingress_node_missing | length == 0
    fail_msg: >-
      The ingress nodes have to be configured together, because each one needs
      the addresses of the others: {{ traefik_ingress_node_missing | join(', ') }}
      {{ 'is' if traefik_ingress_node_missing | length == 1 else 'are' }} in
      {{ traefik_ingress_node_group }} but not in this play. Run against the
      whole group rather than limiting to one host.
    quiet: true

- name: Check the floating address
  when: traefik_ingress_node_floating | bool
  block:
    - name: Check that a virtual address is configured
      ansible.builtin.assert:
        that:
          - traefik_ingress_node_vip | length > 0
        fail_msg: >-
          There is more than one host in {{ traefik_ingress_node_group }}, so
          traefik_ingress_node_vip must give the address they float between
          themselves.
        quiet: true

    - name: Check that the virtual address has an interface
      ansible.builtin.assert:
        that:
          - traefik_ingress_node_vip_device | length > 0
        fail_msg: >-
          No interface on this host holds {{ traefik_ingress_node_address }}, so
          the role cannot tell where the VIP belongs. Correct
          traefik_ingress_node_address.
        quiet: true

- name: Check that exactly one certificate is the default
  vars:
    traefik_ingress_node_defaults: >-
      {{ traefik_ingress_node_certificates
         | selectattr('default', 'defined') | selectattr('default') | list }}
  ansible.builtin.assert:
    that:
      - traefik_ingress_node_certificates | length == 0 or traefik_ingress_node_defaults | length == 1
    fail_msg: >-
      Exactly one of traefik_ingress_node_certificates must have default: true,
      the certificate served when a client asks for a name none of them
      covers. {{ traefik_ingress_node_defaults | length }} do.
    quiet: true

- name: Check the dashboard configuration
  when: traefik_ingress_node_dashboard_enabled | bool
  ansible.builtin.assert:
    that:
      - traefik_ingress_node_dashboard_host | length > 0
      - traefik_ingress_node_dashboard_users | length > 0
    fail_msg: >-
      traefik_ingress_node_dashboard_enabled needs both
      traefik_ingress_node_dashboard_host, the name it is served on, and
      traefik_ingress_node_dashboard_users, so that it is never served without
      authentication.
    quiet: true
