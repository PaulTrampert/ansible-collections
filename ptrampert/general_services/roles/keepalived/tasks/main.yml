---
- name: Check for a supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
    fail_msg: >-
      ptrampert.general_services.keepalived supports Ubuntu only (found
      {{ ansible_facts['distribution'] }}).
    quiet: true

- name: Install keepalived
  ansible.builtin.apt:
    name: keepalived
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the track script user
  ansible.builtin.user:
    name: "{{ keepalived_script_user }}"
    system: true
    create_home: false
    home: /nonexistent
    shell: /usr/sbin/nologin
  when: keepalived_script_user | length > 0

- name: Create the configuration fragment directory
  ansible.builtin.file:
    path: "{{ keepalived_fragment_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the global settings
  ansible.builtin.template:
    src: global_defs.conf.j2
    dest: "{{ keepalived_fragment_dir }}/00-global_defs.conf"
    owner: root
    group: root
    mode: "0600"

- name: Write the scripts and instances of {{ keepalived_config_name }}
  ansible.builtin.template:
    src: instances.conf.j2
    dest: "{{ keepalived_fragment_dir }}/10-{{ keepalived_config_name }}.conf"
    owner: root
    group: root
    mode: "0600"

# One file from every configuration applied to this host, so that applying the
# role for one service leaves another's instances in place. Validated as a
# whole, since a fragment on its own is not a complete configuration.
- name: Assemble the keepalived configuration
  ansible.builtin.assemble:
    src: "{{ keepalived_fragment_dir }}"
    dest: "{{ keepalived_config_file }}"
    owner: root
    group: root
    mode: "0600"
    validate: keepalived -t -f %s
  notify: Reload keepalived

# The package ships no configuration, so keepalived cannot have started before
# the tasks above wrote one.
- name: Enable and start keepalived
  ansible.builtin.systemd_service:
    name: keepalived
    enabled: true
    state: started

# Leaving a reload queued until the end of the play means a later failure hides
# a running daemon whose configuration no longer matches the file on disk.
- name: Apply the pending reload
  ansible.builtin.meta: flush_handlers
