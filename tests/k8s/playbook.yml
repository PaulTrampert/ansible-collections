---
# lb1 exists only in the external-lb topology. In the others the group is
# empty and this play is skipped.
- name: Configure the load balancer in front of the API servers
  hosts: load_balancers
  become: true
  roles:
    - ptrampert.general_services.haproxy

- name: Prepare Kubernetes nodes
  hosts: k8s_cluster
  become: true
  roles:
    - ptrampert.k8s.node

# The API server's address has to answer before the control plane is created:
# kubeadm writes it into the cluster at init. HAProxy on every node balances
# across every API server, so the VIP serves wherever keepalived puts it,
# including on a node whose own API server is down or not created yet. Empty,
# and skipped, in external-lb.
- name: Load balance the API servers on the control-plane nodes
  hosts: control_plane_lb
  become: true
  vars:
    k8s_api_vip_peers: >-
      {{ groups['control_plane_lb'] | reject('eq', inventory_hostname)
         | map('extract', hostvars, 'ansible_host') | list }}
    haproxy_listen:
      - name: kube-apiserver
        bind: "*:{{ k8s_api_lb_port }}"
        mode: tcp
        balance: roundrobin
        # The API server answers /healthz without credentials, so the check
        # tells a running API server from a listening socket.
        options:
          - tcplog
          - httpchk
        extra:
          - "http-check send meth GET uri /healthz"
          - "http-check expect status 200"
        # Watches are long-lived connections.
        timeouts:
          connect: "5s"
          client: "1h"
          server: "1h"
        server_options: "check check-ssl verify none inter 2s fall 3 rise 2"
        servers: "{{ groups['control_plane'] | map('extract', hostvars, 'k8s_api_backend') | list }}"
    keepalived_scripts:
      # The local HAProxy rather than the API server: HAProxy answers before
      # any API server exists, which lets the VIP be up for kubeadm init.
      chk_kube_apiserver_lb:
        command: "/bin/bash -c '</dev/tcp/127.0.0.1/{{ k8s_api_lb_port }}'"
        interval: 2
        fall: 2
        rise: 2
    keepalived_vrrp_instances:
      - name: kube-apiserver
        interface: "{{ k8s_interface }}"
        state: BACKUP
        virtual_router_id: 51
        # Highest on cp1, so the VIP settles there.
        priority: "{{ 150 - groups['control_plane_lb'].index(inventory_hostname) }}"
        virtual_ipaddresses: ["{{ k8s_api_vip }}/24"]
        # A lone node has no peers, and keepalived refuses a unicast source
        # with nobody to send to.
        unicast_src_ip: "{{ ansible_host if k8s_api_vip_peers else '' }}"
        unicast_peers: "{{ k8s_api_vip_peers }}"
        track_scripts:
          - chk_kube_apiserver_lb
  roles:
    - ptrampert.general_services.haproxy
    - ptrampert.general_services.keepalived

# The whole group at once: the first node creates the cluster and issues the
# join credentials for the rest.
- name: Bootstrap and grow the control plane
  hosts: control_plane
  become: true
  roles:
    - ptrampert.k8s.control_plane

- name: Join worker nodes
  hosts: workers
  become: true
  roles:
    - ptrampert.k8s.worker

# nfs1 exists only in the multi topology. In the others the group is empty and
# this play is skipped, as is the NFS provisioner below.
- name: Export a share for the storage provider
  hosts: nfs_servers
  become: true
  tasks:
    - name: Install the NFS server
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present
        update_cache: true

    - name: Create the exported directory
      ansible.builtin.file:
        path: "{{ nfs_export_path }}"
        state: directory
        owner: root
        group: root
        mode: "0777"

    # no_root_squash because the driver creates each volume's directory as
    # root; a test export, not advice for a real one.
    - name: Configure the export
      ansible.builtin.copy:
        content: |
          {{ nfs_export_path }} {{ nfs_export_clients }}(rw,sync,no_subtree_check,no_root_squash)
        dest: /etc/exports
        owner: root
        group: root
        mode: "0644"
      notify: Reload the exports

    - name: Start the NFS server
      ansible.builtin.systemd_service:
        name: nfs-server
        state: started
        enabled: true
  handlers:
    - name: Reload the exports
      ansible.builtin.command: exportfs -ra
      changed_when: true

# Cluster-wide configuration, applied once from a control-plane node rather
# than on every host in the group.
- name: Install the storage providers
  hosts: control_plane[0]
  become: true
  roles:
    - ptrampert.k8s.local_path_provisioner
  tasks:
    - name: Deploy the NFS CSI driver
      ansible.builtin.include_role:
        name: ptrampert.k8s.nfs_provisioner
      when: groups['nfs_servers'] | length > 0

# A storage target for the restic server: SFTP on a host the cluster can reach.
# Stands outside the collection like the NFS export above; the role consumes a
# remote rather than providing one.
- name: Provide an SFTP target for the restic server
  hosts: control_plane[0]
  become: true
  tasks:
    # A fixed salt keeps the hash, and so the task, the same between runs.
    - name: Create the user the server signs in as
      ansible.builtin.user:
        name: "{{ restic_store_user }}"
        home: "{{ restic_store_home }}"
        shell: /bin/sh
        password: "{{ restic_store_password | password_hash('sha512', 'resticstore') }}"

- name: Run the restic REST servers
  hosts: control_plane[0]
  become: true
  tasks:
    - name: Serve the SFTP target
      ansible.builtin.include_role:
        name: ptrampert.k8s.rclone_restic_server

    # The same repositories again, for the append-only checks. Also another
    # process writing the remote behind the first server's back.
    - name: Serve the same target append-only
      ansible.builtin.include_role:
        name: ptrampert.k8s.rclone_restic_server
      vars:
        rclone_restic_server_namespace: "{{ restic_append_only_namespace }}"
        rclone_restic_server_append_only: true

- name: Install the backup operator
  hosts: control_plane[0]
  become: true
  roles:
    - ptrampert.k8s.k8up

- name: Install cert-manager
  hosts: control_plane[0]
  become: true
  pre_tasks:
    - name: Read the real DNS provider, if there is one
      ansible.builtin.include_vars:
        file: "{{ item }}"
      with_first_found:
        - files: [cert-manager-dns.yml]
          skip: true
  roles:
    - ptrampert.k8s.cert_manager
