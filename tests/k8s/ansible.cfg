[defaults]
inventory = inventory/single-node.yml
# collections/ansible_collections/ptrampert links to the repo's ptrampert/, so
# the playbook runs the working-tree roles without a build/install step.
collections_path = collections:~/.ansible/collections:/usr/share/ansible/collections
host_key_checking = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
