---
ansible_user: vagrant
ansible_ssh_private_key_file: .vagrant/machines/{{ inventory_hostname }}/virtualbox/private_key

# eth0 is the VirtualBox NAT interface, identical on every VM; the cluster has
# to use the private network on eth1.
k8s_interface: eth1
node_ip: "{{ ansible_host }}"
control_plane_advertise_address: "{{ ansible_host }}"
control_plane_flannel_iface: "{{ k8s_interface }}"
control_plane_kubeconfig_users: [vagrant]

# Address the API server answers on. In the stacked topologies, playbook.yml
# runs HAProxy on k8s_api_lb_port and floats k8s_api_vip across the
# control-plane nodes with keepalived. external-lb sets k8s_api_endpoint to its
# HAProxy host instead: this file outranks group vars set in an inventory file,
# so it cannot override control_plane_endpoint directly.
k8s_api_vip: 192.168.56.9
k8s_api_lb_port: 8443
control_plane_endpoint: "{{ k8s_api_endpoint | default(k8s_api_vip ~ ':' ~ k8s_api_lb_port) }}"

# How a load balancer reaches this node's API server, collected into its server
# list. Inventory rather than play vars, so every host can read the others'.
k8s_api_backend:
  name: "{{ inventory_hostname }}"
  address: "{{ ansible_host }}:6443"

# The only storage provider in the test cluster, so claims that name no class
# should get it. Exercises the role's default-class toggle.
local_path_provisioner_storage_class_default: true

# The restic REST server stores its repositories over SFTP on the first
# control-plane node, under a user the playbook creates for it. Test
# credentials for throwaway VMs; real ones belong in a vault.
restic_store_host: "{{ hostvars[groups['control_plane'][0]]['ansible_host'] }}"
restic_store_user: restic-store
restic_store_home: /srv/restic-store
restic_store_password: restic-store-test-password
# A second server, refusing deletions, serves the same repositories.
restic_append_only_namespace: rclone-restic-append-only

rclone_restic_server_config:
  store:
    type: sftp
    host: "{{ restic_store_host }}"
    user: "{{ restic_store_user }}"
    # rclone obscure restic-store-test-password
    pass: 2UZj_VN4J-0TTs-2O1fEyud9nTQf9RQizFKjPOnNM9rWFItr6vV4taV0
rclone_restic_server_remote: store:repos
rclone_restic_server_users:
  - name: alice
    password: alice-test-password
  - name: bob
    password: bob-test-password
  # verify.yml's K8up backups.
  - name: k8up
    password: k8up-test-password

# A solver that is never exercised: the issuers become Ready by registering an
# ACME account, which needs no DNS. cert-manager-dns.yml, when present,
# replaces both with a real provider and turns on verify.yml's issuance check.
cert_manager_dns01:
  rfc2136:
    nameserver: 192.0.2.53
    tsigKeyName: verify.example.com.
    tsigAlgorithm: HMACSHA256
    tsigSecretSecretRef:
      name: cert-manager-dns01
      key: tsig-secret
cert_manager_dns01_credential:
  tsig-secret: dmVyaWZ5LXRzaWctc2VjcmV0

# The ingress VIP, which playbook.yml floats between the ingress nodes in the
# topologies that have more than one. The others are reached on the only ingress
# node's address.
k8s_ingress_vip: 192.168.56.7
traefik_ingress_node_endpoint: >-
  {{ k8s_ingress_vip if groups['ingress'] | length > 1
     else hostvars[groups['ingress'][0]]['ansible_host'] }}

# The VMs have no public domain, so the ingress certificates come from a CA
# that playbook.yml creates in cert-manager, rather than from Let's Encrypt.
# Two levels of wildcard, so that verify.yml can check selection by SNI.
traefik_ingress_node_issuer: verify-ca
traefik_ingress_node_certificates:
  - secret_name: wildcard-example-com
    dns_names: ["*.example.com"]
    default: true
  - secret_name: wildcard-internal-example-com
    dns_names: ["*.internal.example.com"]
