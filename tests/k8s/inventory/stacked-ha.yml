---
# Three control-plane nodes load balancing for themselves: HAProxy on each of
# them, and keepalived floating k8s_api_vip between them, both applied by
# playbook.yml. No workers, so the
# control-plane nodes are schedulable and the cluster has somewhere to run
# verify.yml's test pod.
k8s_cluster:
  children:
    control_plane:
      hosts:
        cp1:
          ansible_host: 192.168.56.10
        cp2:
          ansible_host: 192.168.56.11
        cp3:
          ansible_host: 192.168.56.12
    workers:
      hosts: {}
  vars:
    control_plane_schedulable: true

# The control-plane nodes load balance for themselves.
control_plane_lb:
  children:
    control_plane: {}

# Every control-plane node is an ingress node too, so each one runs two
# keepalived instances side by side: the API server's and the ingress's.
ingress:
  hosts:
    cp1:
    cp2:
    cp3:

# Only the external-lb topology has a load balancer host.
load_balancers:
  hosts: {}

# Only the multi topology has an NFS server.
nfs_servers:
  hosts: {}
