---
# One control-plane node that also runs workloads. It still gets a floating API
# server address, so a second control-plane node can be added to it later.
k8s_cluster:
  children:
    control_plane:
      hosts:
        cp1:
          ansible_host: 192.168.56.10
    workers:
      hosts: {}
  vars:
    control_plane_schedulable: true

# Only the external-lb topology has a load balancer host.
load_balancers:
  hosts: {}

# Only the multi topology has an NFS server.
nfs_servers:
  hosts: {}
