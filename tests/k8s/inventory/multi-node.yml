---
# One control-plane node and two workers.
k8s_cluster:
  children:
    control_plane:
      hosts:
        cp1:
          ansible_host: 192.168.56.10
    workers:
      hosts:
        worker1:
          ansible_host: 192.168.56.21
        worker2:
          ansible_host: 192.168.56.22

# Only the external-lb topology has a load balancer host.
load_balancers:
  hosts: {}
