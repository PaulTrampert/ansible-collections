---
# One control-plane node, two workers, and a host exporting a share for the
# NFS storage provider.
k8s_cluster:
  children:
    control_plane:
      hosts:
        cp1:
          ansible_host: 192.168.56.10
    workers:
      hosts:
        worker1:
          ansible_host: 192.168.56.21
        worker2:
          ansible_host: 192.168.56.22
  vars:
    # The export nfs1 serves, which the storage provider has to address.
    nfs_provisioner_server: "{{ hostvars['nfs1']['ansible_host'] }}"
    nfs_provisioner_share: "{{ nfs_export_path }}"

# The lone control-plane node floats the VIP alone, so it can grow.
control_plane_lb:
  children:
    control_plane: {}

# The control-plane node, despite its taint, and one worker but not the other,
# so that Traefik is seen to run exactly where the role was applied. Also the
# topology that exposes the dashboard; the others leave it off.
ingress:
  hosts:
    cp1:
    worker1:
  vars:
    traefik_ingress_node_dashboard_enabled: true
    traefik_ingress_node_dashboard_host: traefik.example.com
    # bcrypt of dashboard-test-password; a test value for throwaway VMs.
    traefik_ingress_node_dashboard_users:
      - "admin:$2b$12$XEDxYEHtWVHibETxbFLfZ.89mdlqRsxZB7eC5dBzixFyLZ7pDM0A2"
    verify_dashboard_password: dashboard-test-password

# Only the external-lb topology has a load balancer host.
load_balancers:
  hosts: {}

nfs_servers:
  hosts:
    nfs1:
      ansible_host: 192.168.56.30

# Both sides need the export: nfs1 serves it, the cluster consumes it.
all:
  vars:
    nfs_export_path: /srv/nfs
    nfs_export_clients: 192.168.56.0/24
