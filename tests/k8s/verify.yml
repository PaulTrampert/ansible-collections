---
- name: Verify the cluster
  hosts: control_plane[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Read the address the cluster was built with
      ansible.builtin.command: kubectl config view -o jsonpath={.clusters[0].cluster.server}
      register: verify_server
      changed_when: false

    # Every kubectl below goes through this address, so the rest of the play
    # exercises the load balancer as well as the cluster.
    - name: Check the cluster uses the expected control plane endpoint
      vars:
        verify_endpoint: >-
          {{ control_plane_endpoint | default('')
             if (control_plane_load_balancer | default('stacked')) == 'external'
             else control_plane_vip ~ ':' ~ (control_plane_lb_port | default(8443)) }}
      ansible.builtin.assert:
        that:
          - verify_server.stdout == 'https://' ~ verify_endpoint
        fail_msg: "API server at {{ verify_server.stdout }}, expected https://{{ verify_endpoint }}"

    - name: Read node Ready status
      ansible.builtin.command: >-
        kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'
      register: verify_nodes
      changed_when: false

    - name: Check that every inventory host is a Ready node
      vars:
        verify_expected: "{{ groups['k8s_cluster'] | map('regex_replace', '$', '=True') | sort }}"
      ansible.builtin.assert:
        that:
          - verify_nodes.stdout_lines | sort == verify_expected
        fail_msg: "Nodes {{ verify_nodes.stdout_lines }}, expected {{ verify_expected }}"

    - name: Read the control-plane nodes
      ansible.builtin.command: kubectl get nodes -l node-role.kubernetes.io/control-plane -o name
      register: verify_control_plane_nodes
      changed_when: false

    - name: Check that every control-plane host joined as one
      ansible.builtin.assert:
        that:
          - verify_control_plane_nodes.stdout_lines | length == groups['control_plane'] | length
        fail_msg: >-
          {{ verify_control_plane_nodes.stdout_lines | length }} control-plane nodes,
          expected {{ groups['control_plane'] | length }}

    # Each control-plane node runs a stacked etcd member. A node that joined
    # without its member starting would leave the cluster a member short.
    - name: Read the etcd members
      ansible.builtin.command: kubectl get pods -n kube-system -l component=etcd -o name
      register: verify_etcd
      changed_when: false

    - name: Check that every control-plane node runs an etcd member
      ansible.builtin.assert:
        that:
          - verify_etcd.stdout_lines | length == groups['control_plane'] | length
        fail_msg: >-
          {{ verify_etcd.stdout_lines | length }} etcd members,
          expected {{ groups['control_plane'] | length }}

    - name: Wait for system pods to be Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready pods --all --namespace {{ item }} --timeout=300s
      loop: [kube-system, kube-flannel]
      changed_when: false

    # Exercises the CNI, CoreDNS, and kube-proxy (Service routing) together.
    - name: Resolve the API server's Service name from a pod
      ansible.builtin.command: >-
        kubectl run verify-dns --image=busybox:1.37 --restart=Never --rm --attach --quiet
        --command -- nslookup kubernetes.default.svc.cluster.local
      register: verify_dns
      changed_when: false
      failed_when: verify_dns.rc != 0 or 'Address' not in verify_dns.stdout

- name: Verify the floating API server address
  hosts: control_plane
  become: true
  tasks:
    - name: Check the stacked load balancer
      when: (control_plane_load_balancer | default('stacked')) == 'stacked'
      block:
        - name: Find the node holding the VIP
          ansible.builtin.include_tasks: tasks/find_vip_holder.yml

        - name: Check that exactly one node holds the VIP
          ansible.builtin.assert:
            that:
              - k8s_vip_holders | length == 1
            fail_msg: "Expected exactly one node to hold {{ k8s_api_vip }}, got {{ k8s_vip_holders }}"

        # Every node runs HAProxy, whether or not it currently holds the VIP,
        # so that the VIP serves the API wherever it lands.
        - name: Check that this node's HAProxy serves the API
          ansible.builtin.uri:
            url: "https://{{ ansible_host }}:{{ control_plane_lb_port | default(8443) }}/healthz"
            validate_certs: false
            return_content: true
          register: verify_healthz
          failed_when: verify_healthz.content != 'ok'

- name: Verify the local-path storage provider
  hosts: control_plane[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    verify_storage_class: "{{ local_path_provisioner_storage_class_name | default('local-path') }}"
  tasks:
    # Fails outright if the role's class is missing. Read as JSON rather than
    # with a jsonpath, whose backslashes would not survive the way the command
    # module splits its arguments.
    - name: Read the role's storage class
      ansible.builtin.command: kubectl get storageclass {{ verify_storage_class }} -o json
      register: verify_class
      changed_when: false

    - name: Check the role's class is the cluster default
      vars:
        verify_class_annotations: >-
          {{ (verify_class.stdout | from_json).metadata.annotations | default({}, true) }}
      ansible.builtin.assert:
        that:
          - verify_class_annotations['storageclass.kubernetes.io/is-default-class'] | default('') == 'true'
        fail_msg: >-
          Storage class {{ verify_storage_class }} is not the cluster default

    # A claim that names no class, so it also proves the default annotation is
    # what the cluster acts on. Binding waits for the writer pod to be
    # scheduled, which is what WaitForFirstConsumer means.
    - name: Provision a volume and read back what a pod wrote to it
      block:
        - name: Create a claim and a pod that writes to it
          ansible.builtin.command:
            cmd: kubectl apply -f -
            stdin: "{{ lookup('ansible.builtin.template', 'templates/verify-storage.yaml.j2') }}"
          changed_when: true

        - name: Wait for the writing pod to finish
          ansible.builtin.command: >-
            kubectl wait --for=jsonpath={.status.phase}=Succeeded pod/verify-storage-writer --timeout=300s
          changed_when: false

        - name: Read the claim's status
          ansible.builtin.command: kubectl get pvc verify-storage -o jsonpath={.status.phase}
          register: verify_claim
          changed_when: false

        - name: Check the claim is bound
          ansible.builtin.assert:
            that:
              - verify_claim.stdout == 'Bound'
            fail_msg: "Claim verify-storage is {{ verify_claim.stdout }}, expected Bound"

        - name: Wait for the reading pod to finish
          ansible.builtin.command: >-
            kubectl wait --for=jsonpath={.status.phase}=Succeeded pod/verify-storage-reader --timeout=300s
          changed_when: false

        - name: Read what the second pod saw
          ansible.builtin.command: kubectl logs pod/verify-storage-reader
          register: verify_data
          changed_when: false

        - name: Check the second pod read the first one's data
          ansible.builtin.assert:
            that:
              - verify_data.stdout == 'written by verify-storage-writer'
            fail_msg: "Second pod read {{ verify_data.stdout | to_json }}"
      always:
        - name: Remove the verification resources
          ansible.builtin.command: >-
            kubectl delete --ignore-not-found --wait=false
            pod/verify-storage-writer pod/verify-storage-reader pvc/verify-storage
          changed_when: true

- name: Verify the NFS storage provider
  hosts: control_plane[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    verify_nfs_class: "{{ nfs_provisioner_storage_class_name | default('nfs') }}"
    verify_nfs_writer_node: "{{ groups['workers'][0] | default('') }}"
    verify_nfs_reader_node: "{{ groups['workers'][-1] | default('') }}"
  tasks:
    # Only the multi topology has an NFS server, and it is also the only one
    # with two workers to move a volume between.
    - name: Check the NFS storage class
      when: groups['nfs_servers'] | length > 0
      block:
        # Fails outright if the role's class is missing.
        - name: Read the provisioner behind the NFS class
          ansible.builtin.command: >-
            kubectl get storageclass {{ verify_nfs_class }} -o jsonpath={.provisioner}
          register: verify_nfs_provisioner
          changed_when: false

        - name: Check the class is provisioned by the NFS CSI driver
          ansible.builtin.assert:
            that:
              - verify_nfs_provisioner.stdout == 'nfs.csi.k8s.io'
            fail_msg: >-
              Storage class {{ verify_nfs_class }} is provisioned by
              {{ verify_nfs_provisioner.stdout }}

        - name: Move a volume between nodes
          block:
            - name: Create a claim and a pod on one worker that writes to it
              ansible.builtin.command:
                cmd: kubectl apply -f -
                stdin: "{{ lookup('ansible.builtin.template', 'templates/verify-nfs-storage.yaml.j2') }}"
              changed_when: true

            - name: Wait for the writing pod to finish
              ansible.builtin.command: >-
                kubectl wait --for=jsonpath={.status.phase}=Succeeded pod/verify-nfs-writer --timeout=300s
              changed_when: false

            - name: Create a pod on the other worker that reads the volume
              ansible.builtin.command:
                cmd: kubectl apply -f -
                stdin: "{{ lookup('ansible.builtin.template', 'templates/verify-nfs-reader.yaml.j2') }}"
              changed_when: true

            - name: Wait for the reading pod to finish
              ansible.builtin.command: >-
                kubectl wait --for=jsonpath={.status.phase}=Succeeded pod/verify-nfs-reader --timeout=300s
              changed_when: false

            - name: Read what the pod on the other node saw
              ansible.builtin.command: kubectl logs pod/verify-nfs-reader
              register: verify_nfs_data
              changed_when: false

            - name: Check it read what the first pod wrote
              ansible.builtin.assert:
                that:
                  - verify_nfs_data.stdout == 'written by verify-nfs-writer'
                fail_msg: >-
                  Pod on {{ verify_nfs_reader_node }} read
                  {{ verify_nfs_data.stdout | to_json }}

            # The data belongs to the server, not to either node.
            - name: Look for the volume on the NFS server
              ansible.builtin.find:
                paths: "{{ nfs_export_path }}"
                patterns: probe
                recurse: true
              delegate_to: "{{ groups['nfs_servers'][0] }}"
              register: verify_nfs_files

            - name: Check the volume was created on the export
              ansible.builtin.assert:
                that:
                  - verify_nfs_files.files | length == 1
                fail_msg: >-
                  Expected one volume under {{ nfs_export_path }} on
                  {{ groups['nfs_servers'][0] }}, found
                  {{ verify_nfs_files.files | map(attribute='path') | list }}
          always:
            - name: Remove the verification resources
              ansible.builtin.command: >-
                kubectl delete --ignore-not-found --wait=false
                pod/verify-nfs-writer pod/verify-nfs-reader pvc/verify-nfs
              changed_when: true

- name: Verify the restic REST server
  hosts: control_plane[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    verify_restic_image: docker.io/restic/restic:0.19.1
    verify_restic_password: verify-repository-password
    verify_restic_namespace: "{{ rclone_restic_server_namespace | default('rclone-restic-server') }}"
    verify_restic_selector: app.kubernetes.io/name=rclone-restic-server
    verify_restic_server: http://alice:alice-test-password@rclone-restic-server.{{ verify_restic_namespace }}.svc:8080
    verify_restic_append_only_server: >-
      http://alice:alice-test-password@rclone-restic-server.{{ restic_append_only_namespace }}.svc:8080
    verify_restic_repository: rest:{{ verify_restic_server }}/alice/verify
    # The same files in a pod and on the host, so that each side can check
    # what it gets back against a source of its own.
    verify_restic_source: |
      mkdir -p "$src/sub"
      seq 1 100000 > "$src/numbers"
      echo 'backed up by restic' > "$src/sub/greeting"
    verify_restic_host_dir: /tmp/verify-restic
    # What restic on the host opens, directly on the remote rather than
    # through the server.
    verify_restic_direct: rclone:{{ rclone_restic_server_remote }}/alice/verify
  tasks:
    # The server must not hold any state of its own beyond the config copy,
    # so the repositories can go away between runs.
    - name: Remove the repositories a previous run left behind
      ansible.builtin.file:
        path: "{{ restic_store_home }}/repos"
        state: absent

    - name: Back up, check and restore through the server
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: init, backup, check, restore
        verify_restic_script: |
          src=/src
          {{ verify_restic_source }}
          restic init
          restic backup /src
          restic check --read-data
          restic restore latest --target /restore
          diff -r /src /restore/src

    - name: Check the round trip succeeded
      ansible.builtin.assert:
        that:
          - verify_restic.rc == 0
        fail_msg: "restic said: {{ verify_restic.stdout }}"

    - name: Open the repository without credentials
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: no credentials
        verify_restic_repository: >-
          rest:http://rclone-restic-server.{{ verify_restic_namespace }}.svc:8080/alice/verify
        verify_restic_script: restic cat config

    - name: Check the server refused it
      ansible.builtin.assert:
        that:
          - verify_restic.rc != 0
          - "'401' in verify_restic.stdout"
        fail_msg: "restic said: {{ verify_restic.stdout }}"

    - name: Open another user's repository
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: another user's repository
        verify_restic_repository: >-
          rest:http://bob:bob-test-password@rclone-restic-server.{{ verify_restic_namespace }}.svc:8080/alice/verify
        verify_restic_script: restic cat config

    - name: Check the server refused it
      ansible.builtin.assert:
        that:
          - verify_restic.rc != 0
          - "'403' in verify_restic.stdout"
        fail_msg: "restic said: {{ verify_restic.stdout }}"

    # So that the refusal above is about whose repository it was.
    - name: Create the other user's own repository
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: the user's own repository
        verify_restic_repository: >-
          rest:http://bob:bob-test-password@rclone-restic-server.{{ verify_restic_namespace }}.svc:8080/bob/verify
        verify_restic_script: restic init

    - name: Check the other user reached their own repository
      ansible.builtin.assert:
        that:
          - verify_restic.rc == 0
        fail_msg: "restic said: {{ verify_restic.stdout }}"

    # Stands in for rclone rewriting a refreshed token. The next converge must
    # leave it alone and report no changes.
    - name: Change the server's copy of the config
      ansible.builtin.command: >-
        kubectl exec -n {{ verify_restic_namespace }} deploy/rclone-restic-server -c rclone --
        sh -c 'echo "# kept across restarts" >> /config/rclone.conf'
      changed_when: true

    # A pod that dies straight after a backup finished must not take the
    # backup with it.
    - name: Back up again through the server
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: second backup
        verify_restic_script: |
          src=/src
          {{ verify_restic_source }}
          echo 'second backup' > /src/second
          restic backup /src

    - name: Check the second backup succeeded
      ansible.builtin.assert:
        that:
          - verify_restic.rc == 0
        fail_msg: "restic said: {{ verify_restic.stdout }}"

    - name: Kill the server pod
      ansible.builtin.command: >-
        kubectl delete pod -n {{ verify_restic_namespace }} -l {{ verify_restic_selector }}
        --grace-period=0 --force
      changed_when: true

    - name: Wait for the replacement pod
      ansible.builtin.command: >-
        kubectl wait pod -n {{ verify_restic_namespace }} -l {{ verify_restic_selector }}
        --for=condition=Ready --timeout=60s
      register: verify_restic_ready
      until: verify_restic_ready.rc == 0
      retries: 5
      delay: 5
      changed_when: false

    - name: Read the replacement pod's copy of the config
      ansible.builtin.command: >-
        kubectl exec -n {{ verify_restic_namespace }} deploy/rclone-restic-server -c rclone --
        cat /config/rclone.conf
      register: verify_restic_config
      changed_when: false

    - name: Check the copy survived the pod
      ansible.builtin.assert:
        that:
          - "'# kept across restarts' in verify_restic_config.stdout"
        fail_msg: The replacement pod's config was seeded again

    - name: Read the repository through the replacement pod
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: after the pod was replaced
        verify_restic_script: |
          restic check --read-data
          test "$(restic snapshots --json | grep -o '"short_id"' | wc -l)" -eq 2

    - name: Check both backups are still there
      ansible.builtin.assert:
        that:
          - verify_restic.rc == 0
        fail_msg: "restic said: {{ verify_restic.stdout }}"

    - name: Install restic and rclone on the host
      ansible.builtin.apt:
        name: [restic, rclone]
        state: present

    - name: Create a directory for the checks on the host
      ansible.builtin.file:
        path: "{{ verify_restic_host_dir }}"
        state: directory
        mode: "0700"

    - name: Configure the remote for rclone on the host
      ansible.builtin.template:
        src: templates/restic-remote-rclone.conf.j2
        dest: "{{ verify_restic_host_dir }}/rclone.conf"
        mode: "0600"

    - name: Check the repository without the server
      environment:
        RESTIC_PASSWORD: "{{ verify_restic_password }}"
        RCLONE_CONFIG: "{{ verify_restic_host_dir }}/rclone.conf"
      block:
        # The command the README gives for exporting a snapshot.
        - name: Export the latest snapshot as a tarball, straight from the remote
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              rm -rf source dump
              mkdir dump
              restic -r {{ verify_restic_direct }} dump --archive tar latest / | gzip > backup.tar.gz
              tar -xzf backup.tar.gz -C dump
            chdir: "{{ verify_restic_host_dir }}"
            executable: /bin/bash
          changed_when: true

        # The latest snapshot is the second backup.
        - name: Compare the tarball with the source
          ansible.builtin.shell:
            cmd: |
              set -e
              src=source
              {{ verify_restic_source }}
              echo 'second backup' > source/second
              diff -r source dump/src
            chdir: "{{ verify_restic_host_dir }}"
            executable: /bin/bash
          changed_when: false

        # Writes the remote behind the servers' backs: a backup, then a prune
        # that deletes what the servers may have listed and cached.
        - name: Back up and prune straight on the remote
          ansible.builtin.shell:
            cmd: >-
              restic -r {{ verify_restic_direct }} backup /etc/hostname &&
              restic -r {{ verify_restic_direct }} forget --keep-last 1 --group-by '' --prune
          changed_when: true

    - name: Read the repository through the server after the prune
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: after a prune behind the server's back
        verify_restic_script: |
          restic check --read-data
          test "$(restic snapshots --json | grep -o '"short_id"' | wc -l)" -eq 1

    - name: Check the server saw the prune
      ansible.builtin.assert:
        that:
          - verify_restic.rc == 0
        fail_msg: "restic said: {{ verify_restic.stdout }}"

    - name: Back up and try to prune through the append-only server
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: append-only
        verify_restic_repository: rest:{{ verify_restic_append_only_server }}/alice/verify
        verify_restic_script: |
          src=/src
          {{ verify_restic_source }}
          restic backup /src
          if restic forget --keep-last 1 --group-by '' --prune; then
            echo 'forget --prune succeeded on an append-only server'
            exit 1
          fi
          echo 'more' > /src/more
          restic backup /src

    - name: Check backups succeeded and the prune did not
      ansible.builtin.assert:
        that:
          - verify_restic.rc == 0
        fail_msg: "restic said: {{ verify_restic.stdout }}"
