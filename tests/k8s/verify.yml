---
- name: Verify the cluster
  hosts: control_plane[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Read the address the cluster was built with
      ansible.builtin.command: kubectl config view -o jsonpath={.clusters[0].cluster.server}
      register: verify_server
      changed_when: false

    # Every kubectl below goes through this address, so the rest of the play
    # exercises the load balancer as well as the cluster.
    - name: Check the cluster uses the expected control plane endpoint
      ansible.builtin.assert:
        that:
          - verify_server.stdout == 'https://' ~ control_plane_endpoint
        fail_msg: "API server at {{ verify_server.stdout }}, expected https://{{ control_plane_endpoint }}"

    - name: Read node Ready status
      ansible.builtin.command: >-
        kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'
      register: verify_nodes
      changed_when: false

    - name: Check that every inventory host is a Ready node
      vars:
        verify_expected: "{{ groups['k8s_cluster'] | map('regex_replace', '$', '=True') | sort }}"
      ansible.builtin.assert:
        that:
          - verify_nodes.stdout_lines | sort == verify_expected
        fail_msg: "Nodes {{ verify_nodes.stdout_lines }}, expected {{ verify_expected }}"

    - name: Read the control-plane nodes
      ansible.builtin.command: kubectl get nodes -l node-role.kubernetes.io/control-plane -o name
      register: verify_control_plane_nodes
      changed_when: false

    - name: Check that every control-plane host joined as one
      ansible.builtin.assert:
        that:
          - verify_control_plane_nodes.stdout_lines | length == groups['control_plane'] | length
        fail_msg: >-
          {{ verify_control_plane_nodes.stdout_lines | length }} control-plane nodes,
          expected {{ groups['control_plane'] | length }}

    # Each control-plane node runs a stacked etcd member. A node that joined
    # without its member starting would leave the cluster a member short.
    - name: Read the etcd members
      ansible.builtin.command: kubectl get pods -n kube-system -l component=etcd -o name
      register: verify_etcd
      changed_when: false

    - name: Check that every control-plane node runs an etcd member
      ansible.builtin.assert:
        that:
          - verify_etcd.stdout_lines | length == groups['control_plane'] | length
        fail_msg: >-
          {{ verify_etcd.stdout_lines | length }} etcd members,
          expected {{ groups['control_plane'] | length }}

    - name: Wait for system pods to be Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready pods --all --namespace {{ item }} --timeout=300s
      loop: [kube-system, kube-flannel]
      changed_when: false

    # Exercises the CNI, CoreDNS, and kube-proxy (Service routing) together.
    - name: Resolve the API server's Service name from a pod
      ansible.builtin.command: >-
        kubectl run verify-dns --image=busybox:1.37 --restart=Never --rm --attach --quiet
        --command -- nslookup kubernetes.default.svc.cluster.local
      register: verify_dns
      changed_when: false
      failed_when: verify_dns.rc != 0 or 'Address' not in verify_dns.stdout

- name: Verify the floating API server address
  hosts: control_plane
  become: true
  tasks:
    - name: Check the stacked load balancer
      when: inventory_hostname in groups['control_plane_lb']
      block:
        - name: Find the node holding the VIP
          ansible.builtin.include_tasks: tasks/find_vip_holder.yml

        - name: Check that exactly one node holds the VIP
          ansible.builtin.assert:
            that:
              - k8s_vip_holders | length == 1
            fail_msg: "Expected exactly one node to hold {{ k8s_api_vip }}, got {{ k8s_vip_holders }}"

        # Every node runs HAProxy, whether or not it currently holds the VIP,
        # so that the VIP serves the API wherever it lands.
        - name: Check that this node's HAProxy serves the API
          ansible.builtin.uri:
            url: "https://{{ ansible_host }}:{{ k8s_api_lb_port }}/healthz"
            validate_certs: false
            return_content: true
          register: verify_healthz
          failed_when: verify_healthz.content != 'ok'

- name: Verify the local-path storage provider
  hosts: control_plane[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    verify_storage_class: "{{ local_path_provisioner_storage_class_name | default('local-path') }}"
  tasks:
    # Fails outright if the role's class is missing. Read as JSON rather than
    # with a jsonpath, whose backslashes would not survive the way the command
    # module splits its arguments.
    - name: Read the role's storage class
      ansible.builtin.command: kubectl get storageclass {{ verify_storage_class }} -o json
      register: verify_class
      changed_when: false

    - name: Check the role's class is the cluster default
      vars:
        verify_class_annotations: >-
          {{ (verify_class.stdout | from_json).metadata.annotations | default({}, true) }}
      ansible.builtin.assert:
        that:
          - verify_class_annotations['storageclass.kubernetes.io/is-default-class'] | default('') == 'true'
        fail_msg: >-
          Storage class {{ verify_storage_class }} is not the cluster default

    # A claim that names no class, so it also proves the default annotation is
    # what the cluster acts on. Binding waits for the writer pod to be
    # scheduled, which is what WaitForFirstConsumer means.
    - name: Provision a volume and read back what a pod wrote to it
      block:
        - name: Create a claim and a pod that writes to it
          ansible.builtin.command:
            cmd: kubectl apply -f -
            stdin: "{{ lookup('ansible.builtin.template', 'templates/verify-storage.yaml.j2') }}"
          changed_when: true

        - name: Wait for the writing pod to finish
          ansible.builtin.command: >-
            kubectl wait --for=jsonpath={.status.phase}=Succeeded pod/verify-storage-writer --timeout=300s
          changed_when: false

        - name: Read the claim's status
          ansible.builtin.command: kubectl get pvc verify-storage -o jsonpath={.status.phase}
          register: verify_claim
          changed_when: false

        - name: Check the claim is bound
          ansible.builtin.assert:
            that:
              - verify_claim.stdout == 'Bound'
            fail_msg: "Claim verify-storage is {{ verify_claim.stdout }}, expected Bound"

        - name: Wait for the reading pod to finish
          ansible.builtin.command: >-
            kubectl wait --for=jsonpath={.status.phase}=Succeeded pod/verify-storage-reader --timeout=300s
          changed_when: false

        - name: Read what the second pod saw
          ansible.builtin.command: kubectl logs pod/verify-storage-reader
          register: verify_data
          changed_when: false

        - name: Check the second pod read the first one's data
          ansible.builtin.assert:
            that:
              - verify_data.stdout == 'written by verify-storage-writer'
            fail_msg: "Second pod read {{ verify_data.stdout | to_json }}"
      always:
        - name: Remove the verification resources
          ansible.builtin.command: >-
            kubectl delete --ignore-not-found --wait=false
            pod/verify-storage-writer pod/verify-storage-reader pvc/verify-storage
          changed_when: true

- name: Verify the NFS storage provider
  hosts: control_plane[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    verify_nfs_class: "{{ nfs_provisioner_storage_class_name | default('nfs') }}"
    verify_nfs_writer_node: "{{ groups['workers'][0] | default('') }}"
    verify_nfs_reader_node: "{{ groups['workers'][-1] | default('') }}"
    # delegate_to is templated, and has to name a host, even for a task its
    # block's when skips. Without an NFS server, this host stands in for one.
    verify_nfs_server: "{{ groups['nfs_servers'] | first | default(inventory_hostname) }}"
  tasks:
    # Only the multi topology has an NFS server, and it is also the only one
    # with two workers to move a volume between.
    - name: Check the NFS storage class
      when: groups['nfs_servers'] | length > 0
      block:
        # Fails outright if the role's class is missing.
        - name: Read the provisioner behind the NFS class
          ansible.builtin.command: >-
            kubectl get storageclass {{ verify_nfs_class }} -o jsonpath={.provisioner}
          register: verify_nfs_provisioner
          changed_when: false

        - name: Check the class is provisioned by the NFS CSI driver
          ansible.builtin.assert:
            that:
              - verify_nfs_provisioner.stdout == 'nfs.csi.k8s.io'
            fail_msg: >-
              Storage class {{ verify_nfs_class }} is provisioned by
              {{ verify_nfs_provisioner.stdout }}

        - name: Move a volume between nodes
          block:
            - name: Create a claim and a pod on one worker that writes to it
              ansible.builtin.command:
                cmd: kubectl apply -f -
                stdin: "{{ lookup('ansible.builtin.template', 'templates/verify-nfs-storage.yaml.j2') }}"
              changed_when: true

            - name: Wait for the writing pod to finish
              ansible.builtin.command: >-
                kubectl wait --for=jsonpath={.status.phase}=Succeeded pod/verify-nfs-writer --timeout=300s
              changed_when: false

            - name: Create a pod on the other worker that reads the volume
              ansible.builtin.command:
                cmd: kubectl apply -f -
                stdin: "{{ lookup('ansible.builtin.template', 'templates/verify-nfs-reader.yaml.j2') }}"
              changed_when: true

            - name: Wait for the reading pod to finish
              ansible.builtin.command: >-
                kubectl wait --for=jsonpath={.status.phase}=Succeeded pod/verify-nfs-reader --timeout=300s
              changed_when: false

            - name: Read what the pod on the other node saw
              ansible.builtin.command: kubectl logs pod/verify-nfs-reader
              register: verify_nfs_data
              changed_when: false

            - name: Check it read what the first pod wrote
              ansible.builtin.assert:
                that:
                  - verify_nfs_data.stdout == 'written by verify-nfs-writer'
                fail_msg: >-
                  Pod on {{ verify_nfs_reader_node }} read
                  {{ verify_nfs_data.stdout | to_json }}

            # The data belongs to the server, not to either node.
            - name: Look for the volume on the NFS server
              ansible.builtin.find:
                paths: "{{ nfs_export_path }}"
                patterns: probe
                recurse: true
              delegate_to: "{{ verify_nfs_server }}"
              register: verify_nfs_files

            - name: Check the volume was created on the export
              ansible.builtin.assert:
                that:
                  - verify_nfs_files.files | length == 1
                fail_msg: >-
                  Expected one volume under {{ nfs_export_path }} on
                  {{ verify_nfs_server }}, found
                  {{ verify_nfs_files.files | map(attribute='path') | list }}
          always:
            - name: Remove the verification resources
              ansible.builtin.command: >-
                kubectl delete --ignore-not-found --wait=false
                pod/verify-nfs-writer pod/verify-nfs-reader pvc/verify-nfs
              changed_when: true

- name: Verify the restic REST server
  hosts: control_plane[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    verify_restic_image: docker.io/restic/restic:0.19.1
    verify_restic_password: verify-repository-password
    verify_restic_namespace: "{{ rclone_restic_server_namespace | default('rclone-restic-server') }}"
    verify_restic_selector: app.kubernetes.io/name=rclone-restic-server
    verify_restic_server: http://alice:alice-test-password@rclone-restic-server.{{ verify_restic_namespace }}.svc:8080
    verify_restic_append_only_server: >-
      http://alice:alice-test-password@rclone-restic-server.{{ restic_append_only_namespace }}.svc:8080
    verify_restic_repository: rest:{{ verify_restic_server }}/alice/verify
    # The same files in a pod and on the host, so that each side can check
    # what it gets back against a source of its own.
    verify_restic_source: |
      mkdir -p "$src/sub"
      seq 1 100000 > "$src/numbers"
      echo 'backed up by restic' > "$src/sub/greeting"
    verify_restic_host_dir: /tmp/verify-restic
    # What restic on the host opens, directly on the remote rather than
    # through the server.
    verify_restic_direct: rclone:{{ rclone_restic_server_remote }}/alice/verify
  tasks:
    # The server must not hold any state of its own beyond the config copy,
    # so the repositories can go away between runs.
    - name: Remove the repositories a previous run left behind
      ansible.builtin.file:
        path: "{{ restic_store_home }}/repos"
        state: absent

    - name: Back up, check and restore through the server
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: init, backup, check, restore
        verify_restic_script: |
          src=/src
          {{ verify_restic_source }}
          restic init
          restic backup /src
          restic check --read-data
          restic restore latest --target /restore
          diff -r /src /restore/src

    - name: Check the round trip succeeded
      ansible.builtin.assert:
        that:
          - verify_restic.rc == 0
        fail_msg: "restic said: {{ verify_restic.stdout }}"

    - name: Open the repository without credentials
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: no credentials
        verify_restic_repository: >-
          rest:http://rclone-restic-server.{{ verify_restic_namespace }}.svc:8080/alice/verify
        verify_restic_script: restic cat config

    - name: Check the server refused it
      ansible.builtin.assert:
        that:
          - verify_restic.rc != 0
          - "'401' in verify_restic.stdout"
        fail_msg: "restic said: {{ verify_restic.stdout }}"

    - name: Open another user's repository
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: another user's repository
        verify_restic_repository: >-
          rest:http://bob:bob-test-password@rclone-restic-server.{{ verify_restic_namespace }}.svc:8080/alice/verify
        verify_restic_script: restic cat config

    - name: Check the server refused it
      ansible.builtin.assert:
        that:
          - verify_restic.rc != 0
          - "'403' in verify_restic.stdout"
        fail_msg: "restic said: {{ verify_restic.stdout }}"

    # So that the refusal above is about whose repository it was.
    - name: Create the other user's own repository
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: the user's own repository
        verify_restic_repository: >-
          rest:http://bob:bob-test-password@rclone-restic-server.{{ verify_restic_namespace }}.svc:8080/bob/verify
        verify_restic_script: restic init

    - name: Check the other user reached their own repository
      ansible.builtin.assert:
        that:
          - verify_restic.rc == 0
        fail_msg: "restic said: {{ verify_restic.stdout }}"

    # Stands in for rclone rewriting a refreshed token. The next converge must
    # leave it alone and report no changes.
    - name: Change the server's copy of the config
      ansible.builtin.command: >-
        kubectl exec -n {{ verify_restic_namespace }} deploy/rclone-restic-server -c rclone --
        sh -c 'echo "# kept across restarts" >> /config/rclone.conf'
      changed_when: true

    # A pod that dies straight after a backup finished must not take the
    # backup with it.
    - name: Back up again through the server
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: second backup
        verify_restic_script: |
          src=/src
          {{ verify_restic_source }}
          echo 'second backup' > /src/second
          restic backup /src

    - name: Check the second backup succeeded
      ansible.builtin.assert:
        that:
          - verify_restic.rc == 0
        fail_msg: "restic said: {{ verify_restic.stdout }}"

    - name: Kill the server pod
      ansible.builtin.command: >-
        kubectl delete pod -n {{ verify_restic_namespace }} -l {{ verify_restic_selector }}
        --grace-period=0 --force
      changed_when: true

    - name: Wait for the replacement pod
      ansible.builtin.command: >-
        kubectl wait pod -n {{ verify_restic_namespace }} -l {{ verify_restic_selector }}
        --for=condition=Ready --timeout=60s
      register: verify_restic_ready
      until: verify_restic_ready.rc == 0
      retries: 5
      delay: 5
      changed_when: false

    - name: Read the replacement pod's copy of the config
      ansible.builtin.command: >-
        kubectl exec -n {{ verify_restic_namespace }} deploy/rclone-restic-server -c rclone --
        cat /config/rclone.conf
      register: verify_restic_config
      changed_when: false

    - name: Check the copy survived the pod
      ansible.builtin.assert:
        that:
          - "'# kept across restarts' in verify_restic_config.stdout"
        fail_msg: The replacement pod's config was seeded again

    - name: Read the repository through the replacement pod
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: after the pod was replaced
        verify_restic_script: |
          restic check --read-data
          test "$(restic snapshots --json | grep -o '"short_id"' | wc -l)" -eq 2

    - name: Check both backups are still there
      ansible.builtin.assert:
        that:
          - verify_restic.rc == 0
        fail_msg: "restic said: {{ verify_restic.stdout }}"

    - name: Install restic and rclone on the host
      ansible.builtin.apt:
        name: [restic, rclone]
        state: present

    - name: Create a directory for the checks on the host
      ansible.builtin.file:
        path: "{{ verify_restic_host_dir }}"
        state: directory
        mode: "0700"

    - name: Configure the remote for rclone on the host
      ansible.builtin.template:
        src: templates/restic-remote-rclone.conf.j2
        dest: "{{ verify_restic_host_dir }}/rclone.conf"
        mode: "0600"

    - name: Check the repository without the server
      environment:
        RESTIC_PASSWORD: "{{ verify_restic_password }}"
        RCLONE_CONFIG: "{{ verify_restic_host_dir }}/rclone.conf"
      block:
        # The command the README gives for exporting a snapshot.
        - name: Export the latest snapshot as a tarball, straight from the remote
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              rm -rf source dump
              mkdir dump
              restic -r {{ verify_restic_direct }} dump --archive tar latest / | gzip > backup.tar.gz
              tar -xzf backup.tar.gz -C dump
            chdir: "{{ verify_restic_host_dir }}"
            executable: /bin/bash
          changed_when: true

        # The latest snapshot is the second backup.
        - name: Compare the tarball with the source
          ansible.builtin.shell:
            cmd: |
              set -e
              src=source
              {{ verify_restic_source }}
              echo 'second backup' > source/second
              diff -r source dump/src
            chdir: "{{ verify_restic_host_dir }}"
            executable: /bin/bash
          changed_when: false

        # Writes the remote behind the servers' backs: a backup, then a prune
        # that deletes what the servers may have listed and cached.
        - name: Back up and prune straight on the remote
          ansible.builtin.shell:
            cmd: >-
              restic -r {{ verify_restic_direct }} backup /etc/hostname &&
              restic -r {{ verify_restic_direct }} forget --keep-last 1 --group-by '' --prune
          changed_when: true

    - name: Read the repository through the server after the prune
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: after a prune behind the server's back
        verify_restic_script: |
          restic check --read-data
          test "$(restic snapshots --json | grep -o '"short_id"' | wc -l)" -eq 1

    - name: Check the server saw the prune
      ansible.builtin.assert:
        that:
          - verify_restic.rc == 0
        fail_msg: "restic said: {{ verify_restic.stdout }}"

    - name: Back up and try to prune through the append-only server
      ansible.builtin.include_tasks: tasks/run_restic.yml
      vars:
        verify_restic_step: append-only
        verify_restic_repository: rest:{{ verify_restic_append_only_server }}/alice/verify
        verify_restic_script: |
          src=/src
          {{ verify_restic_source }}
          restic backup /src
          if restic forget --keep-last 1 --group-by '' --prune; then
            echo 'forget --prune succeeded on an append-only server'
            exit 1
          fi
          echo 'more' > /src/more
          restic backup /src

    - name: Check backups succeeded and the prune did not
      ansible.builtin.assert:
        that:
          - verify_restic.rc == 0
        fail_msg: "restic said: {{ verify_restic.stdout }}"

- name: Verify the K8up backup operator
  hosts: control_plane[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    verify_k8up_namespace: verify-k8up
    verify_k8up_user: k8up
    verify_k8up_user_password: k8up-test-password
    verify_k8up_repository_password: verify-k8up-repository-password
    verify_k8up_backend:
      repoPasswordSecretRef:
        name: verify-k8up-repo
        key: repository-password
      rest:
        url: >-
          http://rclone-restic-server.{{ rclone_restic_server_namespace | default('rclone-restic-server') }}.svc:8080/{{ verify_k8up_user }}/verify
        userSecretRef:
          name: verify-k8up-repo
          key: username
        # Spelled this way upstream.
        passwordSecretReg:
          name: verify-k8up-repo
          key: password
    # A claim on node-local storage everywhere, and one on NFS where there is
    # an NFS server.
    verify_k8up_claims: >-
      {{ [{'name': 'verify-k8up-local',
           'class': local_path_provisioner_storage_class_name | default('local-path')}]
         + ([{'name': 'verify-k8up-nfs',
              'class': nfs_provisioner_storage_class_name | default('nfs')}]
            if groups['nfs_servers'] | length > 0 else []) }}
    # What each pod writes to its claim. The host builds the same files to
    # check what it gets back from the repository.
    verify_k8up_source: |
      mkdir -p "$src/sub"
      seq 1 100000 > "$src/numbers"
      echo 'backed up by k8up' > "$src/sub/greeting"
    # The stand-in database's dump tool. K8up stores its output as
    # /<namespace>-<container><file extension>.
    verify_k8up_dump_command: sh -c 'seq 1 50000'
    verify_k8up_dump_file: /{{ verify_k8up_namespace }}-db.sql
    verify_k8up_host_dir: /tmp/verify-k8up
    # What restic on the host opens: the repository straight on the remote,
    # as after losing the cluster.
    verify_k8up_direct: rclone:{{ rclone_restic_server_remote }}/{{ verify_k8up_user }}/verify
  tasks:
    - name: Wait for the operator
      ansible.builtin.command: >-
        kubectl rollout status deployment/k8up -n {{ k8up_namespace | default('k8up') }} --timeout=300s
      changed_when: false

    # The role applies the CRDs itself, because Helm never upgrades them.
    - name: Read who manages the Schedule CRD
      ansible.builtin.command: >-
        kubectl get crd schedules.k8up.io -o jsonpath={.metadata.managedFields[*].manager}
      register: verify_k8up_crd_managers
      changed_when: false

    - name: Check the role applied the CRDs
      ansible.builtin.assert:
        that:
          - "'ptrampert.k8s.k8up' in verify_k8up_crd_managers.stdout.split()"
        fail_msg: "Schedule CRD managed by {{ verify_k8up_crd_managers.stdout }}"

    - name: Remove the repository a previous run left behind
      ansible.builtin.file:
        path: "{{ restic_store_home }}/repos/{{ verify_k8up_user }}"
        state: absent

    - name: Back up and restore the namespace
      block:
        - name: Create the workloads
          ansible.builtin.command:
            cmd: kubectl apply -f -
            stdin: "{{ lookup('ansible.builtin.template', 'templates/verify-k8up.yaml.j2') }}"
          changed_when: true

        - name: Wait for the workloads to fill their volumes
          ansible.builtin.command: >-
            kubectl wait pod --all -n {{ verify_k8up_namespace }} --for=condition=Ready --timeout=300s
          changed_when: false

        - name: Schedule backups of the namespace
          ansible.builtin.command:
            cmd: kubectl apply -f -
            stdin: "{{ lookup('ansible.builtin.template', 'templates/verify-k8up-schedule.yaml.j2') }}"
          changed_when: true

        - name: Wait for the Schedule to start a backup
          ansible.builtin.command: >-
            kubectl get backups -n {{ verify_k8up_namespace }} -o name
          register: verify_k8up_backups
          until: verify_k8up_backups.stdout_lines | length > 0
          retries: 30
          delay: 5
          changed_when: false

        - name: Wait for the backup to finish
          ansible.builtin.command: >-
            kubectl wait {{ verify_k8up_backups.stdout_lines[0] }} -n {{ verify_k8up_namespace }}
            --for=condition=Completed --timeout=600s
          changed_when: false

        - name: Read how the backup finished
          ansible.builtin.command:
            argv:
              - kubectl
              - get
              - "{{ verify_k8up_backups.stdout_lines[0] }}"
              - -n
              - "{{ verify_k8up_namespace }}"
              - -o
              - jsonpath={.status.conditions[?(@.type=="Completed")].reason}
          register: verify_k8up_backup_result
          changed_when: false

        - name: Check the backup succeeded
          ansible.builtin.assert:
            that:
              - verify_k8up_backup_result.stdout == 'Succeeded'
            fail_msg: "Backup finished with {{ verify_k8up_backup_result.stdout }}"

        # Waits for the Schedule's Backups and their jobs to be deleted with
        # it, so that no backup is still running once the data is deleted
        # below: it would take a snapshot of the empty volumes.
        - name: Stop the Schedule
          ansible.builtin.command: >-
            kubectl delete schedule verify-k8up -n {{ verify_k8up_namespace }}
            --cascade=foreground --timeout=300s
          changed_when: true

        - name: Wait for the backup pods to stop
          ansible.builtin.command: >-
            kubectl get pods -n {{ verify_k8up_namespace }} -l k8upjob=true
            --field-selector=status.phase!=Succeeded,status.phase!=Failed -o name
          register: verify_k8up_jobs
          until: verify_k8up_jobs.stdout_lines | length == 0
          retries: 30
          delay: 5
          changed_when: false

        - name: Install restic and rclone on the host
          ansible.builtin.apt:
            name: [restic, rclone]
            state: present

        - name: Create a directory for the checks on the host
          ansible.builtin.file:
            path: "{{ verify_k8up_host_dir }}"
            state: directory
            mode: "0700"

        - name: Configure the remote for rclone on the host
          ansible.builtin.template:
            src: templates/restic-remote-rclone.conf.j2
            dest: "{{ verify_k8up_host_dir }}/rclone.conf"
            mode: "0600"

        - name: Check the repository from the host
          environment:
            RESTIC_PASSWORD: "{{ verify_k8up_repository_password }}"
            RCLONE_CONFIG: "{{ verify_k8up_host_dir }}/rclone.conf"
          block:
            - name: List the snapshots
              ansible.builtin.command: >-
                restic -r {{ verify_k8up_direct }} snapshots --host {{ verify_k8up_namespace }} --json
              register: verify_k8up_snapshots
              changed_when: false

            - name: Check every claim and the dump were backed up
              vars:
                verify_k8up_paths: >-
                  {{ verify_k8up_snapshots.stdout | from_json
                     | map(attribute='paths') | flatten | unique | sort }}
                verify_k8up_expected: >-
                  {{ (verify_k8up_claims | map(attribute='name') | map('regex_replace', '^', '/data/') | list
                      + [verify_k8up_dump_file]) | sort }}
              ansible.builtin.assert:
                that:
                  - verify_k8up_paths == verify_k8up_expected
                fail_msg: "Snapshots of {{ verify_k8up_paths }}, expected {{ verify_k8up_expected }}"

            # The commands the README gives for exporting a snapshot and for
            # restoring a dump outside the cluster.
            - name: Export each claim and the dump as a tarball, and restore the dump
              ansible.builtin.shell:
                cmd: |
                  set -euo pipefail
                  rm -rf source export restore
                  mkdir -p source export restore
                  src=source/claim
                  {{ verify_k8up_source }}
                  seq 1 50000 > source/dump
                  for path in {{ verify_k8up_claims | map(attribute='name') | map('regex_replace', '^', '/data/') | join(' ') }} {{ verify_k8up_dump_file }}; do
                    restic -r {{ verify_k8up_direct }} dump --archive tar \
                      --host {{ verify_k8up_namespace }} --path "$path" latest / | gzip > export.tar.gz
                    tar -xzf export.tar.gz -C export
                  done
                  for claim in {{ verify_k8up_claims | map(attribute='name') | join(' ') }}; do
                    diff -r source/claim "export/data/$claim"
                  done
                  diff source/dump export{{ verify_k8up_dump_file }}
                  restic -r {{ verify_k8up_direct }} restore latest \
                    --host {{ verify_k8up_namespace }} --path {{ verify_k8up_dump_file }} --target restore
                  diff source/dump restore{{ verify_k8up_dump_file }}
                chdir: "{{ verify_k8up_host_dir }}"
                executable: /bin/bash
              changed_when: true

        - name: Delete the data in each claim
          ansible.builtin.command:
            argv: [kubectl, exec, -n, "{{ verify_k8up_namespace }}", "{{ item.name }}", --, sh, -c, rm -rf /data/*]
          loop: "{{ verify_k8up_claims }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: true

        - name: Restore each claim from its latest backup
          ansible.builtin.command:
            cmd: kubectl apply -f -
            stdin: "{{ lookup('ansible.builtin.template', 'templates/verify-k8up-restore.yaml.j2') }}"
          changed_when: true

        - name: Wait for the restores to finish
          ansible.builtin.command: >-
            kubectl wait restore --all -n {{ verify_k8up_namespace }} --for=condition=Completed --timeout=600s
          changed_when: false

        - name: Compare what each claim holds with what was written to it
          ansible.builtin.command:
            argv:
              - kubectl
              - exec
              - -n
              - "{{ verify_k8up_namespace }}"
              - "{{ item.name }}"
              - --
              - sh
              - -ec
              - |
                src=/tmp/expected
                {{ verify_k8up_source }}
                diff -r /tmp/expected /data
          loop: "{{ verify_k8up_claims }}"
          loop_control:
            label: "{{ item.name }}"
          changed_when: false
      always:
        # Also deletes the claims, and with them the volumes.
        - name: Remove the verification namespace
          ansible.builtin.command: >-
            kubectl delete namespace {{ verify_k8up_namespace }} --ignore-not-found --timeout=300s
          changed_when: true

- name: Verify cert-manager
  hosts: control_plane[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    verify_cert_manager_namespace: verify-cert-manager
  tasks:
    - name: Read the real DNS provider, if there is one
      ansible.builtin.include_vars:
        file: "{{ item }}"
      with_first_found:
        - files: [cert-manager-dns.yml]
          skip: true

    - name: Wait for cert-manager's deployments
      ansible.builtin.command: >-
        kubectl rollout status deployment/{{ item }} -n {{ cert_manager_namespace | default('cert-manager') }} --timeout=300s
      loop: [cert-manager, cert-manager-webhook, cert-manager-cainjector]
      changed_when: false

    - name: Check cert-manager's CRDs are established
      ansible.builtin.command: >-
        kubectl wait crd --for=condition=Established --timeout=60s
        certificates.cert-manager.io certificaterequests.cert-manager.io
        issuers.cert-manager.io clusterissuers.cert-manager.io
        orders.acme.cert-manager.io challenges.acme.cert-manager.io
      changed_when: false

    # Each has registered an ACME account with its directory.
    - name: Check both issuers are Ready
      ansible.builtin.command: >-
        kubectl wait clusterissuer/{{ item }} --for=condition=Ready --timeout=60s
      loop: [letsencrypt-staging, letsencrypt-production]
      changed_when: false

    - name: Skip issuance without a real DNS provider
      ansible.builtin.debug:
        msg: >-
          No cert-manager-dns.yml, so no certificate is issued. See README.md
          to check issuance against the staging directory.
      when: verify_cert_manager_domain is not defined

    # A wildcard, as the ingress uses, from the staging directory so as not to
    # spend production's rate limits.
    - name: Issue a certificate from the staging directory
      when: verify_cert_manager_domain is defined
      block:
        - name: Request the certificate
          ansible.builtin.command:
            cmd: kubectl apply -f -
            stdin: |
              apiVersion: v1
              kind: Namespace
              metadata:
                name: {{ verify_cert_manager_namespace }}
              ---
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: verify-wildcard
                namespace: {{ verify_cert_manager_namespace }}
              spec:
                secretName: verify-wildcard-tls
                dnsNames: ["*.{{ verify_cert_manager_domain }}"]
                issuerRef:
                  kind: ClusterIssuer
                  name: letsencrypt-staging
          changed_when: true

        # DNS-01 waits for the TXT record to propagate, which can take minutes.
        - name: Wait for the certificate
          ansible.builtin.command: >-
            kubectl wait certificate/verify-wildcard -n {{ verify_cert_manager_namespace }}
            --for=condition=Ready --timeout=600s
          changed_when: false

        - name: Read the certificate's Secret
          ansible.builtin.command: >-
            kubectl get secret verify-wildcard-tls -n {{ verify_cert_manager_namespace }} -o json
          register: verify_cert_manager_secret
          changed_when: false

        - name: Check the Secret holds a certificate for the wildcard
          vars:
            verify_cert_manager_tls: "{{ verify_cert_manager_secret.stdout | from_json }}"
          ansible.builtin.assert:
            that:
              - verify_cert_manager_tls.type == 'kubernetes.io/tls'
              - verify_cert_manager_tls.data['tls.crt'] | default('') | length > 0
              - verify_cert_manager_tls.data['tls.key'] | default('') | length > 0
              - >-
                verify_cert_manager_tls.metadata.annotations['cert-manager.io/alt-names']
                == '*.' ~ verify_cert_manager_domain
      always:
        - name: Remove the verification namespace
          ansible.builtin.command: >-
            kubectl delete namespace {{ verify_cert_manager_namespace }} --ignore-not-found --timeout=300s
          changed_when: true

- name: Verify the ingress address
  hosts: ingress
  become: true
  vars:
    verify_ingress_floating: "{{ groups['ingress'] | length > 1 }}"
  tasks:
    - name: Read the ingress's keepalived configuration
      ansible.builtin.stat:
        path: /etc/keepalived/fragments.d/10-traefik-ingress.conf
      register: verify_ingress_keepalived

    # A lone ingress node has nothing to fail over to.
    - name: Check keepalived floats the ingress address only across several nodes
      ansible.builtin.assert:
        that:
          - verify_ingress_keepalived.stat.exists == verify_ingress_floating | bool
        fail_msg: >-
          {{ groups['ingress'] | length }} ingress nodes, and keepalived
          {{ 'does not float' if verify_ingress_floating else 'floats' }} the
          ingress address on {{ inventory_hostname }}

    - name: Find the node holding the ingress VIP
      ansible.builtin.include_tasks: tasks/find_vip_holder.yml
      vars:
        k8s_vip_address: "{{ k8s_ingress_vip }}"

    - name: Check how many nodes hold the ingress VIP
      ansible.builtin.assert:
        that:
          - k8s_vip_holders | length == (1 if verify_ingress_floating else 0)
        fail_msg: >-
          Expected {{ 'exactly one node' if verify_ingress_floating else 'no node' }}
          to hold {{ k8s_ingress_vip }}, got {{ k8s_vip_holders }}

- name: Verify the ingress
  hosts: control_plane[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    verify_ingress_namespace: verify-ingress
    verify_ingress_addresses: "{{ groups['ingress'] | map('extract', hostvars, 'ansible_host') | list }}"
    # Where clients reach the ingress: the VIP, or the only ingress node.
    verify_ingress_endpoint: "{{ traefik_ingress_node_endpoint }}"
    verify_ingress_dashboard: "{{ hostvars[groups['ingress'][0]]['traefik_ingress_node_dashboard_enabled'] | default(false) }}"
    # The test CA's certificate, so that curl checks every certificate it is
    # served against it, names included.
    verify_ingress_ca: /root/verify-ingress-ca.crt
    verify_ingress_curl: >-
      curl --silent --show-error --max-time 10 --cacert {{ verify_ingress_ca }}
  tasks:
    - name: Wait for Traefik to roll out
      ansible.builtin.command: kubectl rollout status daemonset/traefik -n traefik --timeout=300s
      changed_when: false

    - name: Read the nodes Traefik runs on
      ansible.builtin.command: >-
        kubectl get pods -n traefik -l app.kubernetes.io/name=traefik
        -o jsonpath='{range .items[*]}{.spec.nodeName}{"\n"}{end}'
      register: verify_ingress_nodes
      changed_when: false

    - name: Check Traefik runs on the ingress nodes and nowhere else
      ansible.builtin.assert:
        that:
          - verify_ingress_nodes.stdout_lines | sort == groups['ingress'] | sort
        fail_msg: "Traefik runs on {{ verify_ingress_nodes.stdout_lines | sort }}, expected {{ groups['ingress'] | sort }}"

    - name: Check the certificates are issued
      ansible.builtin.command: kubectl wait certificate --all -n traefik --for=condition=Ready --timeout=60s
      changed_when: false

    # However many Traefik pods serve a certificate, cert-manager requested it
    # once.
    - name: Read the certificate requests
      ansible.builtin.command: kubectl get certificaterequests -n traefik -o name
      register: verify_ingress_requests
      changed_when: false

    - name: Check each certificate was requested once
      ansible.builtin.assert:
        that:
          - verify_ingress_requests.stdout_lines | length == traefik_ingress_node_certificates | length
        fail_msg: >-
          {{ verify_ingress_requests.stdout_lines | length }} certificate requests for
          {{ traefik_ingress_node_certificates | length }} certificates

    - name: Read the test CA's certificate
      ansible.builtin.command: kubectl get secret verify-ca -n cert-manager -o 'jsonpath={.data.ca\.crt}'
      register: verify_ingress_ca_data
      changed_when: false

    - name: Check routes, certificates and redirects
      block:
        - name: Write the test CA's certificate
          ansible.builtin.copy:
            content: "{{ verify_ingress_ca_data.stdout | b64decode }}"
            dest: "{{ verify_ingress_ca }}"
            owner: root
            group: root
            mode: "0644"

        # An IngressRoute for a name under each certificate, and a standard
        # Ingress, as a third-party chart would bring.
        - name: Deploy a backend behind the ingress
          ansible.builtin.command:
            cmd: kubectl apply -f -
            stdin: |
              apiVersion: v1
              kind: Namespace
              metadata:
                name: {{ verify_ingress_namespace }}
              ---
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: whoami
                namespace: {{ verify_ingress_namespace }}
              spec:
                selector:
                  matchLabels: {app: whoami}
                template:
                  metadata:
                    labels: {app: whoami}
                  spec:
                    containers:
                      - name: whoami
                        image: traefik/whoami:v1.11.0
                        ports: [{containerPort: 80}]
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: whoami
                namespace: {{ verify_ingress_namespace }}
              spec:
                selector: {app: whoami}
                ports: [{port: 80}]
              ---
              apiVersion: traefik.io/v1alpha1
              kind: IngressRoute
              metadata:
                name: whoami
                namespace: {{ verify_ingress_namespace }}
              spec:
                entryPoints: [websecure]
                routes:
                  - kind: Rule
                    match: Host(`whoami.example.com`) || Host(`whoami.internal.example.com`)
                    services: [{name: whoami, port: 80}]
              ---
              apiVersion: networking.k8s.io/v1
              kind: Ingress
              metadata:
                name: whoami
                namespace: {{ verify_ingress_namespace }}
              spec:
                rules:
                  - host: ingress.example.com
                    http:
                      paths:
                        - path: /
                          pathType: Prefix
                          backend:
                            service: {name: whoami, port: {number: 80}}
          changed_when: true

        - name: Wait for the backend
          ansible.builtin.command: kubectl rollout status deployment/whoami -n {{ verify_ingress_namespace }} --timeout=300s
          changed_when: false

        # curl checks the certificate against the test CA and the name asked
        # for, so a name under *.internal.example.com only succeeds if Traefik
        # picked that certificate by SNI.
        - name: Request each name through the ingress address
          ansible.builtin.command: >-
            {{ verify_ingress_curl }} --resolve {{ item }}:443:{{ verify_ingress_endpoint }} https://{{ item }}/
          loop: [whoami.example.com, whoami.internal.example.com, ingress.example.com]
          register: verify_ingress_responses
          until: verify_ingress_responses.rc == 0 and 'Hostname:' in verify_ingress_responses.stdout
          retries: 10
          delay: 3
          changed_when: false

        # Read as JSON rather than with a jsonpath, whose quoting would not
        # survive the way the command module splits its arguments.
        - name: Read the standard Ingress's status
          ansible.builtin.command: kubectl get ingress whoami -n {{ verify_ingress_namespace }} -o json
          register: verify_ingress_status
          until: >-
            (verify_ingress_status.stdout | from_json).status.loadBalancer.ingress
            | default([]) | map(attribute='ip') | list == [verify_ingress_endpoint]
          retries: 10
          delay: 3
          changed_when: false

        - name: Request through every ingress node
          ansible.builtin.command: >-
            {{ verify_ingress_curl }} --resolve whoami.example.com:443:{{ item }} https://whoami.example.com/
          loop: "{{ verify_ingress_addresses }}"
          register: verify_ingress_node_responses
          failed_when: verify_ingress_node_responses.rc != 0 or 'Hostname:' not in verify_ingress_node_responses.stdout
          changed_when: false

        - name: Read the certificate every ingress node serves for each name
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail;
              openssl s_client -connect {{ item.0 }}:443 -servername {{ item.1 }} </dev/null 2>/dev/null
              | openssl x509 -noout -fingerprint -sha256 -ext subjectAltName
            executable: /bin/bash
          loop: "{{ verify_ingress_addresses | product(['whoami.example.com', 'whoami.internal.example.com', 'unknown.invalid']) | list }}"
          register: verify_ingress_served
          changed_when: false

        - name: Check the certificate served for each name
          vars:
            verify_ingress_expected:
              whoami.example.com: "DNS:*.example.com"
              whoami.internal.example.com: "DNS:*.internal.example.com"
              # Matches neither, so gets the default.
              unknown.invalid: "DNS:*.example.com"
          ansible.builtin.assert:
            that:
              - (item.stdout_lines | last | trim) == verify_ingress_expected[item.item.1]
            fail_msg: >-
              {{ item.item.0 }} served {{ item.stdout_lines | last | trim }} for
              {{ item.item.1 }}, expected {{ verify_ingress_expected[item.item.1] }}
          loop: "{{ verify_ingress_served.results }}"
          loop_control:
            label: "{{ item.item.0 }} {{ item.item.1 }}"

        # The same certificate, not one issued per node.
        - name: Check every ingress node serves the same certificates
          vars:
            verify_ingress_fingerprints: >-
              {{ verify_ingress_served.results
                 | map(attribute='stdout_lines') | map('first') | unique | list }}
          ansible.builtin.assert:
            that:
              - verify_ingress_fingerprints | length == traefik_ingress_node_certificates | length
            fail_msg: "Served {{ verify_ingress_fingerprints }}"

        # curl for --resolve, which uri has no equivalent of.
        - name: Request a name over plain HTTP  # noqa: command-instead-of-module
          ansible.builtin.command: >-
            curl --silent --max-time 10 --output /dev/null --write-out '%{http_code} %{redirect_url}'
            --resolve whoami.example.com:80:{{ verify_ingress_endpoint }} http://whoami.example.com/some/path
          register: verify_ingress_http
          changed_when: false

        - name: Check plain HTTP is redirected to HTTPS
          ansible.builtin.assert:
            that:
              - verify_ingress_http.stdout.split(' ')[0] in ['301', '308']
              - verify_ingress_http.stdout.split(' ')[1] is match('https://whoami\.example\.com(:443)?/some/path$')
            fail_msg: "Plain HTTP got {{ verify_ingress_http.stdout }}"

        - name: Request the dashboard
          ansible.builtin.command: >-
            {{ verify_ingress_curl }} --output /dev/null --write-out '%{http_code}'
            --resolve traefik.example.com:443:{{ verify_ingress_endpoint }}
            {{ item.credentials }} https://traefik.example.com/dashboard/
          loop:
            - {name: anonymous, credentials: ""}
            - {name: wrong password, credentials: "--user admin:wrong"}
            - {name: right password, credentials: "--user admin:{{ verify_dashboard_password | default('') }}"}
          loop_control:
            label: "{{ item.name }}"
          register: verify_ingress_dashboard_responses
          changed_when: false

        - name: Check the dashboard is served only with the right password, and only when enabled
          vars:
            verify_ingress_expected: "{{ ['401', '401', '200'] if verify_ingress_dashboard | bool else ['404', '404', '404'] }}"
          ansible.builtin.assert:
            that:
              - verify_ingress_dashboard_responses.results | map(attribute='stdout') | list == verify_ingress_expected
            fail_msg: >-
              The dashboard answered {{ verify_ingress_dashboard_responses.results | map(attribute='stdout') | list }}
              (anonymous, wrong password, right password), expected {{ verify_ingress_expected }}
      always:
        - name: Remove the backend
          ansible.builtin.command: >-
            kubectl delete namespace {{ verify_ingress_namespace }} --ignore-not-found --timeout=300s
          changed_when: true

        - name: Remove the test CA's certificate
          ansible.builtin.file:
            path: "{{ verify_ingress_ca }}"
            state: absent

- name: Verify the dashboard is never served without users
  hosts: ingress
  become: true
  tasks:
    # Expected to fail validation before it changes anything.
    - name: Enable the dashboard with no users
      block:
        - name: Apply the ingress role with no dashboard users
          ansible.builtin.include_role:
            name: ptrampert.k8s.traefik_ingress_node
          vars:
            traefik_ingress_node_dashboard_enabled: true
            traefik_ingress_node_dashboard_host: traefik.example.com
            traefik_ingress_node_dashboard_users: []

        - name: Note that the role accepted it
          ansible.builtin.set_fact:
            verify_dashboard_refused: false
      rescue:
        - name: Note which check refused it
          ansible.builtin.set_fact:
            verify_dashboard_refused: "{{ ansible_failed_task.name is search('Check the dashboard configuration') }}"

    - name: Check the role refused the dashboard without users
      ansible.builtin.assert:
        that:
          - verify_dashboard_refused
        fail_msg: The ingress role accepted an enabled dashboard with no users.
