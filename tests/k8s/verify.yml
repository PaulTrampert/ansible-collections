---
- name: Verify the cluster
  hosts: control_plane[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  tasks:
    - name: Read the address the cluster was built with
      ansible.builtin.command: kubectl config view -o jsonpath={.clusters[0].cluster.server}
      register: verify_server
      changed_when: false

    # Every kubectl below goes through this address, so the rest of the play
    # exercises the load balancer as well as the cluster.
    - name: Check the cluster uses the expected control plane endpoint
      vars:
        verify_endpoint: >-
          {{ control_plane_endpoint | default('')
             if (control_plane_load_balancer | default('stacked')) == 'external'
             else control_plane_vip ~ ':' ~ (control_plane_lb_port | default(8443)) }}
      ansible.builtin.assert:
        that:
          - verify_server.stdout == 'https://' ~ verify_endpoint
        fail_msg: "API server at {{ verify_server.stdout }}, expected https://{{ verify_endpoint }}"

    - name: Read node Ready status
      ansible.builtin.command: >-
        kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}={.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'
      register: verify_nodes
      changed_when: false

    - name: Check that every inventory host is a Ready node
      vars:
        verify_expected: "{{ groups['k8s_cluster'] | map('regex_replace', '$', '=True') | sort }}"
      ansible.builtin.assert:
        that:
          - verify_nodes.stdout_lines | sort == verify_expected
        fail_msg: "Nodes {{ verify_nodes.stdout_lines }}, expected {{ verify_expected }}"

    - name: Read the control-plane nodes
      ansible.builtin.command: kubectl get nodes -l node-role.kubernetes.io/control-plane -o name
      register: verify_control_plane_nodes
      changed_when: false

    - name: Check that every control-plane host joined as one
      ansible.builtin.assert:
        that:
          - verify_control_plane_nodes.stdout_lines | length == groups['control_plane'] | length
        fail_msg: >-
          {{ verify_control_plane_nodes.stdout_lines | length }} control-plane nodes,
          expected {{ groups['control_plane'] | length }}

    # Each control-plane node runs a stacked etcd member. A node that joined
    # without its member starting would leave the cluster a member short.
    - name: Read the etcd members
      ansible.builtin.command: kubectl get pods -n kube-system -l component=etcd -o name
      register: verify_etcd
      changed_when: false

    - name: Check that every control-plane node runs an etcd member
      ansible.builtin.assert:
        that:
          - verify_etcd.stdout_lines | length == groups['control_plane'] | length
        fail_msg: >-
          {{ verify_etcd.stdout_lines | length }} etcd members,
          expected {{ groups['control_plane'] | length }}

    - name: Wait for system pods to be Ready
      ansible.builtin.command: kubectl wait --for=condition=Ready pods --all --namespace {{ item }} --timeout=300s
      loop: [kube-system, kube-flannel]
      changed_when: false

    # Exercises the CNI, CoreDNS, and kube-proxy (Service routing) together.
    - name: Resolve the API server's Service name from a pod
      ansible.builtin.command: >-
        kubectl run verify-dns --image=busybox:1.37 --restart=Never --rm --attach --quiet
        --command -- nslookup kubernetes.default.svc.cluster.local
      register: verify_dns
      changed_when: false
      failed_when: verify_dns.rc != 0 or 'Address' not in verify_dns.stdout

- name: Verify the floating API server address
  hosts: control_plane
  become: true
  tasks:
    - name: Check the stacked load balancer
      when: (control_plane_load_balancer | default('stacked')) == 'stacked'
      block:
        - name: Find the node holding the VIP
          ansible.builtin.include_tasks: tasks/find_vip_holder.yml

        - name: Check that exactly one node holds the VIP
          ansible.builtin.assert:
            that:
              - k8s_vip_holders | length == 1
            fail_msg: "Expected exactly one node to hold {{ k8s_api_vip }}, got {{ k8s_vip_holders }}"

        # Every node runs HAProxy, whether or not it currently holds the VIP,
        # so that the VIP serves the API wherever it lands.
        - name: Check that this node's HAProxy serves the API
          ansible.builtin.uri:
            url: "https://{{ ansible_host }}:{{ control_plane_lb_port | default(8443) }}/healthz"
            validate_certs: false
            return_content: true
          register: verify_healthz
          failed_when: verify_healthz.content != 'ok'

- name: Verify the NFS storage provider
  hosts: control_plane[0]
  become: true
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  vars:
    verify_nfs_class: "{{ nfs_provisioner_storage_class_name | default('nfs') }}"
    verify_nfs_writer_node: "{{ groups['workers'][0] | default('') }}"
    verify_nfs_reader_node: "{{ groups['workers'][-1] | default('') }}"
  tasks:
    # Only the multi topology has an NFS server, and it is also the only one
    # with two workers to move a volume between.
    - name: Check the NFS storage class
      when: groups['nfs_servers'] | length > 0
      block:
        # Fails outright if the role's class is missing.
        - name: Read the provisioner behind the NFS class
          ansible.builtin.command: >-
            kubectl get storageclass {{ verify_nfs_class }} -o jsonpath={.provisioner}
          register: verify_nfs_provisioner
          changed_when: false

        - name: Check the class is provisioned by the NFS CSI driver
          ansible.builtin.assert:
            that:
              - verify_nfs_provisioner.stdout == 'nfs.csi.k8s.io'
            fail_msg: >-
              Storage class {{ verify_nfs_class }} is provisioned by
              {{ verify_nfs_provisioner.stdout }}

        - name: Move a volume between nodes
          block:
            - name: Create a claim and pods on two different nodes
              ansible.builtin.command:
                cmd: kubectl apply -f -
                stdin: "{{ lookup('ansible.builtin.template', 'templates/verify-nfs-storage.yaml.j2') }}"
              changed_when: true

            - name: Wait for the reading pod to finish
              ansible.builtin.command: >-
                kubectl wait --for=jsonpath={.status.phase}=Succeeded pod/verify-nfs-reader --timeout=300s
              changed_when: false

            - name: Read what the pod on the other node saw
              ansible.builtin.command: kubectl logs pod/verify-nfs-reader
              register: verify_nfs_data
              changed_when: false

            - name: Check it read what the first pod wrote
              ansible.builtin.assert:
                that:
                  - verify_nfs_data.stdout == 'written by verify-nfs-writer'
                fail_msg: >-
                  Pod on {{ verify_nfs_reader_node }} read
                  {{ verify_nfs_data.stdout | to_json }}

            # The data belongs to the server, not to either node.
            - name: Look for the volume on the NFS server
              ansible.builtin.find:
                paths: "{{ nfs_export_path }}"
                patterns: probe
                recurse: true
              delegate_to: "{{ groups['nfs_servers'][0] }}"
              register: verify_nfs_files

            - name: Check the volume was created on the export
              ansible.builtin.assert:
                that:
                  - verify_nfs_files.files | length == 1
                fail_msg: >-
                  Expected one volume under {{ nfs_export_path }} on
                  {{ groups['nfs_servers'][0] }}, found
                  {{ verify_nfs_files.files | map(attribute='path') | list }}
          always:
            - name: Remove the verification resources
              ansible.builtin.command: >-
                kubectl delete --ignore-not-found --wait=false
                pod/verify-nfs-writer pod/verify-nfs-reader pvc/verify-nfs
              changed_when: true
